<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudio de mercado · Soccer Cage en Colombia</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#f6f5f1; --sup:#ffffff; --sup2:#fbfaf7; --tinta:#0b0b0b; --tinta2:#4a4945; --tenue:#85837c;
  --linea:#e2e0d8; --linea2:#c9c6bb; --negro:#0d0d0d; --oro:#b8892f; --oro-t:#7d5b17; --oro-s:#f4ead6;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --gris-m:#b9b6ac;
  --ok:#0b7a0b; --ok-s:#e3f3e1; --av:#8a5a00; --av-s:#fdf0cf; --cr:#b42a2a; --cr-s:#fbe4e1; --inf:#1c5cab; --inf-s:#e3eefb;
  --seq1:#e6f0fd; --seq2:#b7d3f6; --seq3:#86b6ef; --seq4:#5598e7; --seq5:#256abf;
  --cab:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --txt:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --lado:264px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:20px}
body{margin:0;background:var(--papel);color:var(--tinta);font:15px/1.62 var(--txt);-webkit-font-smoothing:antialiased}
a{color:var(--inf);text-underline-offset:2px}
a:hover{color:var(--oro-t)}
img{max-width:100%}
[hidden]{display:none!important}

/* ---------- navegación ---------- */
.lado{position:fixed;inset:0 auto 0 0;width:var(--lado);background:var(--negro);color:#e9e6dd;overflow-y:auto;z-index:30;display:flex;flex-direction:column}
.lado .marca{padding:22px 22px 16px;border-bottom:1px solid #26251f}
.lado .marca b{display:block;font:700 22px/1.05 var(--cab);letter-spacing:.04em;text-transform:uppercase;color:#fff}
.lado .marca span{display:block;font-size:11.5px;color:#a8a498;margin-top:6px;letter-spacing:.06em;text-transform:uppercase}
.lado nav{padding:10px 0 20px;flex:1}
.lado nav a{display:flex;gap:10px;align-items:baseline;padding:7px 22px;color:#c9c5b8;text-decoration:none;font-size:13.5px;border-left:3px solid transparent}
.lado nav a i{font:600 12px var(--cab);color:#7b776b;font-style:normal;min-width:18px;letter-spacing:.04em}
.lado nav a:hover{color:#fff;background:#191814}
.lado nav a.act{color:#fff;border-left-color:var(--oro);background:#191814}
.lado nav a.act i{color:var(--oro)}
.lado .pie{padding:14px 22px 20px;border-top:1px solid #26251f;font-size:11.5px;color:#8f8b7e}
.lado .pie button{width:100%;margin-bottom:10px}
.barra{display:none}
/* selector de idioma */
.idioma{display:inline-flex;border:1px solid #4a4638;border-radius:4px;overflow:hidden;margin-top:14px}
.lado .idioma button,.barra .idioma button{width:auto;margin:0;border:0;border-radius:0;background:transparent;color:#c9c5b8;font:600 12px var(--txt);padding:6px 11px;letter-spacing:.02em}
.lado .idioma button:hover,.barra .idioma button:hover{color:#fff}
.lado .idioma button.act,.barra .idioma button.act{background:var(--oro);color:#111}
.barra .idioma{margin-top:0}
.barra .idioma button{padding:5px 8px;font-size:11.5px}
main{margin-left:var(--lado);min-width:0}
.cont{max-width:1120px;margin:0 auto;padding-inline:36px}

/* ---------- portada ---------- */
.portada{background:var(--negro);color:#fff;padding-block:64px 54px;position:relative;overflow:hidden}
.portada::after{content:"";position:absolute;right:-120px;top:-120px;width:520px;height:520px;border:1px solid #3a3320;border-radius:50%;box-shadow:0 0 0 70px #14130f,0 0 0 71px #3a3320,0 0 0 150px #111,0 0 0 151px #2b2618}
.portada .cont{position:relative;z-index:1}
.portada .sobre{font:600 13px var(--cab);letter-spacing:.22em;text-transform:uppercase;color:var(--oro)}
.portada h1{font:700 clamp(40px,6.2vw,78px)/.95 var(--cab);text-transform:uppercase;letter-spacing:.01em;margin:14px 0 18px;max-width:14ch;text-wrap:balance}
.portada h1 em{font-style:normal;color:var(--oro)}
.portada p.baj{font-size:17px;line-height:1.55;color:#d6d2c5;max-width:62ch;margin:0 0 26px}
.fichas{display:flex;flex-wrap:wrap;gap:10px 28px;font-size:12.5px;color:#a8a498;border-top:1px solid #2b2a24;padding-top:18px}
.fichas b{display:block;color:#fff;font-weight:600;font-size:13.5px}

/* ---------- secciones ---------- */
section.sec{padding-block:46px 14px;border-bottom:1px solid var(--linea)}
section.sec:last-of-type{border-bottom:0}
.num{font:600 13px var(--cab);letter-spacing:.2em;text-transform:uppercase;color:var(--oro-t)}
h2{font:700 clamp(30px,3.6vw,42px)/1.02 var(--cab);text-transform:uppercase;letter-spacing:.01em;margin:6px 0 14px;text-wrap:balance}
h3{font:700 23px/1.12 var(--cab);text-transform:uppercase;letter-spacing:.02em;margin:34px 0 10px;text-wrap:balance}
h4{font:600 15px/1.3 var(--txt);margin:20px 0 6px}
p{margin:0 0 13px;max-width:78ch}
.entr{font-size:16.5px;color:var(--tinta2);max-width:74ch}
ul,ol{margin:0 0 14px;padding-left:20px;max-width:78ch}
li{margin-bottom:5px}
small,.peq{font-size:12.5px;color:var(--tinta2)}
.fte{font-size:12px;color:var(--tenue)}
.fte a{color:var(--tinta2)}
sup.r a{font-size:10.5px;text-decoration:none;color:var(--oro-t);font-weight:600;padding:0 1px}

/* etiquetas de tipo de afirmación */
.tg{display:inline-flex;align-items:center;gap:5px;font:600 10.5px/1 var(--txt);letter-spacing:.05em;text-transform:uppercase;padding:4px 7px;border-radius:3px;white-space:nowrap;vertical-align:middle}
.tg::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.tg.dato{background:var(--ok-s);color:var(--ok)}
.tg.est{background:var(--av-s);color:var(--av)}
.tg.est::before{border-radius:0;transform:rotate(45deg)}
.tg.conc{background:var(--inf-s);color:var(--inf)}
.tg.conc::before{border-radius:1px}
.tg.nd{background:#ecebe6;color:#5d5b55}
.tg.nd::before{background:none;border:1.5px solid currentColor}
.leyenda-tg{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12.5px;color:var(--tinta2);margin:10px 0 0}
.leyenda-tg span{display:inline-flex;align-items:center;gap:7px}

/* cajas */
.caja{background:var(--sup);border:1px solid var(--linea);border-radius:6px;padding:18px 20px;margin:0 0 16px}
.caja.oro{border-left:4px solid var(--oro);background:var(--sup2)}
.caja.alerta{border-left:4px solid var(--cr)}
.caja.verde{border-left:4px solid var(--ok)}
.caja h4:first-child{margin-top:0}
.caja>:last-child{margin-bottom:0}
.rej{display:grid;gap:16px;margin:0 0 16px}
.rej.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.rej.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.rej.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.rej>.caja{margin:0}

/* veredicto */
.veredicto{background:var(--negro);color:#fff;border-radius:8px;padding:26px 28px;margin:0 0 22px;display:grid;grid-template-columns:auto 1fr;gap:8px 26px;align-items:center}
.veredicto .sello{font:700 34px/1 var(--cab);text-transform:uppercase;letter-spacing:.03em;color:var(--negro);background:var(--oro);padding:14px 18px;border-radius:4px;text-align:center}
.veredicto .sello small{display:block;font:600 11px var(--txt);letter-spacing:.12em;color:#3a2a08;margin-bottom:4px}
.veredicto p{color:#e4e0d4;margin:0;max-width:70ch}
.veredicto p+p{margin-top:8px}
.veredicto b{color:#fff}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:0 0 18px}
.kpi{background:var(--sup);border:1px solid var(--linea);border-radius:6px;padding:15px 16px 13px;display:flex;flex-direction:column;gap:4px}
.kpi .et{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--tinta2);font-weight:600}
.kpi .val{font:700 31px/1.05 var(--txt);letter-spacing:-.02em}
.kpi .val small{font-size:14px;font-weight:600;color:var(--tinta2);letter-spacing:0}
.kpi .nota{font-size:12.3px;color:var(--tinta2);line-height:1.4}
.kpi .pie{margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11.5px}
.kpi .pie a{color:var(--tenue)}

/* tablas */
.tabla-w{overflow-x:auto;margin:0 0 16px;border:1px solid var(--linea);border-radius:6px;background:var(--sup)}
table{border-collapse:collapse;width:100%;font-size:13.3px}
th,td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--linea)}
thead th{font:600 11.5px var(--txt);letter-spacing:.06em;text-transform:uppercase;color:var(--tinta2);background:var(--sup2);border-bottom:1px solid var(--linea2);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.c,th.c{text-align:center}
tr.dest td:not(.h){background:var(--oro-s)}
td b.nm{font-weight:600}
th[data-ord]{cursor:pointer;user-select:none}
th[data-ord]::after{content:" ↕";color:var(--gris-m)}
th[data-ord].asc::after{content:" ↑";color:var(--tinta)}
th[data-ord].desc::after{content:" ↓";color:var(--tinta)}

/* filtros */
.filtros{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;margin:0 0 14px;padding:12px 14px;background:var(--sup);border:1px solid var(--linea);border-radius:6px}
.filtros label{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta2);font-weight:600}
.filtros select,.filtros input[type=search]{font:14px var(--txt);padding:7px 9px;border:1px solid var(--linea2);border-radius:4px;background:#fff;color:var(--tinta);min-width:150px}
.filtros .cuenta{margin-left:auto;font-size:12.5px;color:var(--tinta2);align-self:center}
button,.btn{font:600 13px var(--txt);padding:8px 13px;border-radius:4px;border:1px solid var(--linea2);background:#fff;color:var(--tinta);cursor:pointer}
button:hover,.btn:hover{border-color:var(--tinta)}
.lado button{background:var(--oro);border-color:var(--oro);color:#111}
button.sec2{background:transparent;border-color:transparent;color:var(--inf);padding:4px 6px;text-decoration:underline}
:focus-visible{outline:2px solid var(--oro);outline-offset:2px}

/* tarjetas de competidor */
.comp{background:var(--sup);border:1px solid var(--linea);border-radius:6px;margin:0 0 10px}
.comp>summary{list-style:none;cursor:pointer;padding:13px 16px;display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.6fr) minmax(0,1.3fr) 108px 20px;gap:12px;align-items:center}
.comp>summary::-webkit-details-marker{display:none}
.comp>summary .nm{font-weight:600;font-size:15px;line-height:1.25}
.comp>summary .nm small{display:block;font-weight:400;margin-top:2px}
.comp>summary .pr{font-size:13px;font-variant-numeric:tabular-nums}
.comp>summary .fl{color:var(--tenue);transition:transform .15s}
.comp[open]>summary .fl{transform:rotate(90deg)}
.comp[open]>summary{border-bottom:1px solid var(--linea)}
.comp .cuerpo{padding:14px 16px 16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 26px}
.comp dl{margin:0;display:grid;grid-template-columns:128px minmax(0,1fr);gap:6px 12px;font-size:13.3px;align-content:start}
.comp dt{color:var(--tinta2);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;padding-top:2px}
.comp dd{margin:0;min-width:0;overflow-wrap:anywhere}
.comp .ftes{grid-column:1/-1;border-top:1px dashed var(--linea);margin-top:10px;padding-top:9px;font-size:12.3px;color:var(--tinta2)}
.chip{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:20px;background:#eeece6;color:var(--tinta2);margin:0 4px 3px 0;white-space:nowrap}
.chip.d{background:#fde7df;color:#8f3310}
.chip.i{background:var(--inf-s);color:var(--inf)}
.chip.s{background:#ecebe6;color:#55534d}
.amz{display:inline-flex;gap:3px;align-items:center;font-size:11.5px;color:var(--tinta2)}
.amz i{width:13px;height:7px;border-radius:2px;background:#e3e1d9}
.amz i.on{background:var(--s2)}

/* gráficos de barras */
.graf{background:var(--sup);border:1px solid var(--linea);border-radius:6px;padding:16px 18px 14px;margin:0 0 16px}
.graf h4{margin:0 0 2px;font-size:15px}
.graf .sub{font-size:12.5px;color:var(--tinta2);margin:0 0 12px;max-width:none}
.graf .acc{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.barras{display:grid;gap:6px}
.bf{display:grid;grid-template-columns:minmax(120px,31%) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px;position:relative;padding:1px 0;border-radius:3px}
.bf:hover,.bf:focus{background:#f3f1ea;outline:0}
.bf .et{text-align:right;color:var(--tinta);line-height:1.25;overflow-wrap:anywhere}
.bf .et small{display:block;color:var(--tenue);font-size:11.3px}
.bf .pista{height:16px;position:relative;border-left:1px solid var(--linea2)}
.bf .b{position:absolute;left:0;top:1px;bottom:1px;border-radius:0 4px 4px 0;background:var(--s1);min-width:2px}
.bf.gris .b{background:var(--gris-m)}
.bf.oro .b{background:var(--oro)}
.bf.s2 .b{background:var(--s2)}
.bf.s3 .b{background:var(--s3)}
.bf .rango{position:absolute;top:6px;height:4px;border-radius:2px;background:var(--s1)}
.bf .v{font-variant-numeric:tabular-nums;min-width:74px;text-align:left;color:var(--tinta2);font-size:12.5px;white-space:nowrap}
.bf.oro .v,.bf.oro .et{font-weight:600;color:var(--tinta)}
.ley{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.3px;color:var(--tinta2);margin:10px 0 0}
.ley span{display:inline-flex;align-items:center;gap:6px}
.ley i{width:11px;height:11px;border-radius:2px;display:inline-block}
#tip{position:fixed;z-index:60;pointer-events:none;background:#111;color:#fff;font-size:12.3px;line-height:1.4;padding:8px 10px;border-radius:5px;max-width:280px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#tip b{display:block;font-size:12.8px;margin-bottom:2px}

/* matriz */
.mz td.h{text-align:center;font-variant-numeric:tabular-nums;font-weight:600;min-width:58px}
.mz td.tot{font-weight:700;font-size:15px;text-align:right;font-variant-numeric:tabular-nums}
.mz th.rot{white-space:normal;min-width:74px;max-width:96px;text-align:center;line-height:1.2;text-transform:none;letter-spacing:0;font-size:11.5px}
.mz th.rot small{display:block;color:var(--oro-t);font-weight:700;margin-top:2px}
.h1{background:var(--seq1)}.h2{background:var(--seq2)}.h3{background:var(--seq3)}.h4{background:var(--seq4);color:#fff}.h5{background:var(--seq5);color:#fff}
.escala{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tinta2);margin:0 0 14px}
.escala i{width:26px;height:12px;display:inline-block}
.pesos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 18px;margin:0 0 14px}
.pesos label{font-size:12.3px;color:var(--tinta2);display:flex;flex-direction:column;gap:2px}
.pesos label b{color:var(--tinta);font-weight:600;display:flex;justify-content:space-between;gap:8px}
.pesos input[type=range]{width:100%;accent-color:var(--oro)}

/* mapa */
.mapa-w{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start;margin:0 0 16px}
.mapa{background:var(--sup);border:1px solid var(--linea);border-radius:6px;padding:10px}
.mapa svg{width:100%;height:auto;display:block}
.mapa .pais{fill:#efede6;stroke:#bdb9ad;stroke-width:1}
.mapa .pt{cursor:pointer}
.mapa .pt circle{stroke:#fff;stroke-width:2}
.mapa .pt text{font:600 12px var(--txt);fill:var(--tinta);paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.mapa .pt.sel circle{stroke:var(--tinta);stroke-width:2.5}
.t1 circle{fill:var(--oro)}.t2 circle{fill:var(--s1)}.t3 circle{fill:var(--gris-m)}
.ficha-ciudad{background:var(--sup);border:1px solid var(--linea);border-radius:6px;padding:16px 18px}
.ficha-ciudad h4{margin:0 0 2px;font:700 26px/1 var(--cab);text-transform:uppercase}
.ficha-ciudad dl{display:grid;grid-template-columns:140px minmax(0,1fr);gap:6px 12px;font-size:13.3px;margin:12px 0 0}
.ficha-ciudad dt{color:var(--tinta2);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;padding-top:2px}
.ficha-ciudad dd{margin:0}

/* DOFA */
.dofa{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:0 0 16px}
.dofa>div{background:var(--sup);border:1px solid var(--linea);border-top:4px solid var(--tinta);border-radius:6px;padding:16px 18px}
.dofa h4{margin:0 0 8px;font:700 20px var(--cab);text-transform:uppercase;letter-spacing:.04em}
.dofa h4 small{font:500 11.5px var(--txt);color:var(--tinta2);letter-spacing:.05em;margin-left:6px}
.dofa .f{border-top-color:var(--ok)}.dofa .o{border-top-color:var(--s1)}.dofa .d{border-top-color:var(--oro)}.dofa .a{border-top-color:var(--cr)}
.dofa ul{margin:0;font-size:13.6px}

/* escenarios */
.esc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:0 0 16px}
.esc>div{background:var(--sup);border:1px solid var(--linea);border-radius:6px;padding:16px 18px}
.esc h4{margin:0 0 2px;font:700 21px var(--cab);text-transform:uppercase;letter-spacing:.03em}
.esc .gr{font:700 27px/1.1 var(--txt);letter-spacing:-.02em;margin:10px 0 2px}
.esc .gr.neg{color:var(--cr)}
.esc dl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:13px;margin:10px 0 0}
.esc dt{color:var(--tinta2)}.esc dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.esc dl .tt{border-top:1px solid var(--linea2);padding-top:5px;font-weight:600;color:var(--tinta)}
.sim{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;align-items:start}
.sim .ctr label{display:block;font-size:12.5px;color:var(--tinta2);margin:0 0 12px}
.sim .ctr label b{display:flex;justify-content:space-between;color:var(--tinta);font-weight:600;font-size:13.3px}
.sim .ctr input[type=range]{width:100%;accent-color:var(--oro)}
.sim .res dl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;font-size:13.5px;margin:0}
.sim .res dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.sim .res .tt{border-top:1px solid var(--linea2);padding-top:6px;font-weight:700}
.sim .res .gr{font:700 30px/1.1 var(--txt);letter-spacing:-.02em}
.sim .res .gr.neg{color:var(--cr)}

/* fases */
.fases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:0 0 16px;counter-reset:f}
.fases>div{background:var(--sup);border:1px solid var(--linea);border-radius:6px;padding:16px 18px;position:relative}
.fases .ff{font:600 12px var(--cab);letter-spacing:.18em;text-transform:uppercase;color:var(--oro-t)}
.fases h4{margin:2px 0 4px;font:700 22px/1.1 var(--cab);text-transform:uppercase}
.fases ul{font-size:13.5px;margin:8px 0 0}

/* preguntas */
.qa{counter-reset:q;display:grid;gap:10px;margin:0 0 18px}
.qa>div{background:var(--sup);border:1px solid var(--linea);border-radius:6px;padding:14px 18px 14px 62px;position:relative}
.qa>div::before{counter-increment:q;content:counter(q);position:absolute;left:18px;top:12px;font:700 30px/1 var(--cab);color:var(--oro)}
.qa h4{margin:0 0 4px;font-size:15px}
.qa p{margin:0;font-size:14px;max-width:none}

/* fuentes */
.ftes-lista{columns:2;column-gap:28px;font-size:12.8px;padding-left:0;list-style:none;max-width:none}
.ftes-lista li{break-inside:avoid;margin:0 0 7px;padding-left:30px;position:relative;overflow-wrap:anywhere}

<header class="portada">
  <div class="cont">
    <div class="sobre">Estudio de mercado · Expansión internacional</div>
    <h1>Soccer Cage en <em>Colombia</em></h1>
    <p class="baj">Evaluación de la oportunidad de llevar a Colombia los campamentos Juventus con entrenadores de Italia: mercado, competidores, publicidad, ciudades, aliados, precios, viabilidad económica y estrategia de entrada.</p>
    <div class="fichas">
      <div><b>Soccer Cage LLC</b>Preparado para la dirección</div>
      <div><b>5 de noviembre de 2026</b>Fecha de corte de la investigación</div>
      <div><b><span id="nFuentes">—</span> fuentes enlazadas</b>Cada dato lleva su referencia</div>
      <div><b>Pesos colombianos (COP)</b>Con la moneda original indicada</div>
    </div>
  </div>
</header>

<!-- ============ RESUMEN ============ -->
<section class="sec" id="resumen" data-n="00" data-t="Resumen ejecutivo">
<div class="cont">
  <span class="num">Resumen ejecutivo</span>
  <h2>Hay demanda, y un punto clave por revisar: la licencia</h2>
  <div class="veredicto">
    <div class="sello"><small>PUNTO CLAVE</small>Revisar la licencia</div>
    <div>
      <p><b>Es importante revisar el tema de la licencia antes de avanzar.</b> En Colombia ya opera Juventus Academy Colombia, con licencia oficial desde hace diez años, sedes en Bogotá, Cúcuta y Bucaramanga y una clínica vacacional propia a COP 890.000 por semana.</p>
      <p>Convendría conocer con Juventus el alcance de esa licencia. A partir de ahí, una opción a considerar sería una prueba de bajo riesgo en 2027, con aliado local y dos sedes en un mismo viaje.</p>
    </div>
  </div>

  <div class="kpis" data-kpis="kpis"></div>
  <div class="leyenda-tg">
    <span><span class="tg dato">Dato verificado</span> cifra publicada por la fuente citada</span>
    <span><span class="tg est">Estimación</span> cálculo propio con supuestos explícitos</span>
    <span><span class="tg conc">Conclusión propia</span> interpretación de los hallazgos</span>
    <span><span class="tg nd">No disponible</span> dato que no es público</span>
  </div>

  <h3>Los seis hallazgos principales</h3>
  <div class="rej c2">
    <div class="caja alerta"><h4>1. Juventus ya tiene licenciatario en Colombia</h4><p>Juventus Academy Colombia opera desde 2015-2016, se presenta como "la única academia con licencia oficial europea en el país" y en 2026 lanzó un equipo en la Primera C<sup data-f="blu-primerac,icbf-juve"></sup>. Ya hizo diez campamentos en cinco ciudades<sup data-f="juve-7"></sup>. El alcance territorial de su licencia no es público.</p></div>
    <div class="caja verde"><h4>2. El formato está validado por un tercero</h4><p>El Campus Barça, con entrenadores que viajan desde el club, pasó de una ciudad en 2024 a siete en 2026 y cobra COP 1.750.000 por cinco días<sup data-f="barca-sedes"></sup>. La Federación cobra COP 1.850.000 más IVA por su semana<sup data-f="fcf-web"></sup>.</p></div>
    <div class="caja"><h4>3. La capacidad de pago está muy concentrada</h4><p>El 47 % de la clase alta del país vive en Bogotá; Bogotá, Medellín y Cali suman el 68 %<sup data-f="dane-clases-cp"></sup>. Fuera de esas tres, ninguna ciudad pasa de 51 mil personas de clase alta.</p></div>
    <div class="caja"><h4>4. La marca Juventus pesa poco por sí sola</h4><p>En búsquedas, Juventus recibe entre el 6 % y el 10 % del interés de Real Madrid<sup data-f="trends-clubes"></sup>. Por eso la venta se apoyaría mejor en el producto (entrenadores de Italia, selección oficial) que en la afición.</p></div>
    <div class="caja"><h4>5. El diferenciador sigue libre</h4><p>La clínica del licenciatario la dictan entrenadores locales; la única visita italiana documentada, en 2024, fue descrita como "la primera en nueve años"<sup data-f="neiva-juve"></sup>. Nadie ofrece hoy entrenadores de Juventus llegados de Italia con una selección oficial.</p></div>
    <div class="caja oro"><h4>6. La economía es ajustada</h4><p>Con el costo de traer entrenadores de Italia y un IVA de 19 %, un camp de tres días a COP 850.000 necesita cerca de <b><span data-pe="1">—</span> niños por sede</b> para no perder, incluso repartiendo los vuelos entre dos ciudades. Una sede sola con 60 niños pierde dinero. <span class="tg est">Estimación</span></p></div>
  </div>
</div>
</section>

<!-- ============ 1 OBJETIVO ============ -->
<section class="sec" id="objetivo" data-n="01" data-t="Objetivo y alcance">
<div class="cont">
  <span class="num">01</span>
  <h2>Objetivo y alcance</h2>
  <p class="entr">Determinar si Soccer Cage LLC debe operar en Colombia replicando el modelo que usa en Estados Unidos, México y Puerto Rico: campamentos y clínicas Juventus para niños y jóvenes de 6 a 16 años, dictados por entrenadores de Juventus Academy que viajan desde Italia.</p>
  <div class="rej c3">
    <div class="caja"><h4>Qué se evaluó</h4><ul><li>Tamaño y perfil del mercado</li><li>Competidores directos, indirectos y sustitutos</li><li>Publicidad activa en Meta</li><li>Ocho ciudades con matriz ponderada</li><li>Aliados potenciales con contacto público</li><li>Precios, costos y tres escenarios</li></ul></div>
    <div class="caja"><h4>Modelo de referencia</h4><ul><li>ID Camp en Estados Unidos: USD 225 por dos días (COP 728.000)<sup data-f="juve-usa"></sup></li><li>ID Camp en México: MX$4.675 por tres días (COP 812.700)</li><li>Venta por publicidad en Meta, correo y mensajes</li><li>Sedes alquiladas a socios locales</li></ul></div>
    <div class="caja"><h4>Cómo leer el informe</h4><ul><li>Cada cifra enlaza a su fuente con un número entre corchetes</li><li>Las etiquetas separan datos, estimaciones y conclusiones</li><li>Donde un precio o una cifra no es público, se dice</li><li>Los filtros y tablas son interactivos</li></ul></div>
  </div>
</div>
</section>

<!-- ============ 2 MERCADO ============ -->
<section class="sec" id="mercado" data-n="02" data-t="Mercado colombiano">
<div class="cont">
  <span class="num">02</span>
  <h2>El mercado colombiano</h2>
  <p class="entr">Un país con 8,9 millones de niños en la edad del producto, pero donde solo una franja estrecha y muy concentrada puede pagar un campamento de precio internacional.</p>

  <h3>Tamaño y tendencia</h3>
  <div class="rej c3">
    <div class="caja"><h4>8.908.288 niños de 6 a 16 años</h4><p>Proyección del DANE para 2026; 6,3 millones viven en zonas urbanas<sup data-f="dane-nac"></sup>. <span class="tg dato">Dato verificado</span></p></div>
    <div class="caja"><h4>32 % menos nacimientos</h4><p>De 647.521 nacidos vivos en 2016 a 441.537 en 2025<sup data-f="nacimientos"></sup>. Los niños que hoy tienen de 6 a 10 años son la última cohorte grande: la ventana favorable son los próximos cinco a siete años. <span class="tg conc">Conclusión propia</span></p></div>
    <div class="caja"><h4>8 % hace deporte extraescolar</h4><p>Solo el 8 % de los niños de 6 a 12 años practica deporte después del colegio; en estrato 6 es el 41 %<sup data-f="deporte-8"></sup>. El público del producto es el que ya paga por deporte. <span class="tg dato">Dato verificado</span></p></div>
  </div>

  <h3>Capacidad de pago</h3>
  <p>El DANE define la clase alta como los hogares con ingreso superior a COP 5.081.953 por persona al mes: más de COP 20 millones mensuales para una familia de cuatro. Son 1,7 millones de personas, el 3,3 % del país<sup data-f="dane-clases-cp"></sup>.</p>
  <div class="rej c2">
    <div data-barras="claseAlta"></div>
    <div data-barras="sam"></div>
  </div>
  <div data-tabla="demog"></div>
  <p class="fte">Fuentes: DANE, proyecciones de población 2026<sup data-f="dane-pob"></sup>, clases sociales 2025<sup data-f="dane-clases"></sup> e ingreso y líneas de pobreza 2025<sup data-f="dane-pm"></sup>. A.M. = área metropolitana. La línea de pobreza es el costo mensual por persona de la canasta básica en cada ciudad; se usa como referencia oficial del costo de vida.</p>

  <h3>Lo que ya pagan las familias objetivo</h3>
  <div class="rej c3">
    <div class="caja"><h4>Colegios de élite</h4><p>Entre COP 3,5 y 5,5 millones al mes en los colegios más caros de Bogotá, Medellín y Barranquilla<sup data-f="colegio-caro,colegios-caros"></sup>. Un camp de COP 850.000 equivale a menos de una semana de pensión.</p></div>
    <div class="caja"><h4>Fútbol de club local</h4><p>Matrícula anual de COP 360.000 a 590.000 y mensualidad de COP 210.000 a 540.000 en Millonarios, Nacional y Juventus Academy<sup data-f="mfc-matricula,nal-brochure,jac-img-mensual"></sup>.</p></div>
    <div class="caja"><h4>Sector privado en contracción</h4><p>Cerca de 800 colegios privados cerraron desde 2020 y la ocupación bajó a alrededor del 60 % según el gremio<sup data-f="colegios-cierre"></sup>. Es una barrera y una oportunidad: colegios que buscan programas para retener alumnos.</p></div>
  </div>

  <h3>Tamaño de mercado</h3>
  <div class="tabla-w"><table>
    <thead><tr><th>Nivel</th><th>Definición</th><th class="n">Niños de 6 a 16</th><th>Tipo</th></tr></thead>
    <tbody>
      <tr><td><b class="nm">Mercado total</b></td><td>Todos los niños en edad del producto</td><td class="n">8.908.288</td><td><span class="tg dato">Dato verificado</span></td></tr>
      <tr><td><b class="nm">Mercado núcleo</b></td><td>Hogares de clase alta en siete áreas metropolitanas</td><td class="n">≈ 134.000</td><td><span class="tg est">Estimación</span></td></tr>
      <tr><td><b class="nm">Mercado ampliado</b></td><td>Núcleo más el 15 % superior de la clase media</td><td class="n">≈ 337.000</td><td><span class="tg est">Estimación</span></td></tr>
      <tr class="dest"><td><b class="nm">Alcanzable el primer año</b></td><td>Entre el 1 % y el 3 % de los niños del núcleo que juegan fútbol organizado (supuesto: 25 %)</td><td class="n">300 a 1.000</td><td><span class="tg est">Estimación</span></td></tr>
    </tbody></table></div>
  <p class="peq">Contraste: hay 2,08 millones de alumnos en colegios privados<sup data-f="matricula-2025"></sup> y, según el gremio, entre el 10 % y el 13 % pertenece a estratos 4, 5 y 6, es decir, entre 208.000 y 270.000 alumnos. Es el mismo orden de magnitud que el mercado estimado.</p>

  <h3>Interés por los clubes europeos</h3>
  <div class="rej c2">
    <div data-barras="trends"></div>
    <div>
      <div class="caja"><h4>El interés sigue a los jugadores colombianos</h4><p>Bayern multiplicó por nueve su interés de búsqueda con la llegada de Luis Díaz; Liverpool lo perdió cuando se fue<sup data-f="trends-clubes"></sup>. Juventus fichó en agosto de 2026 al defensa colombiano Jhon Lucumí<sup data-f="lucumi"></sup>: un argumento local que antes no existía, aunque todavía no se nota en las búsquedas.</p></div>
      <div class="caja"><h4>Dónde se busca más a Juventus</h4><p>En la costa Caribe (Bolívar, Sucre, Atlántico y Córdoba), justo donde menos clase alta hay. En el interior, Bogotá y Valle van por delante de Antioquia.</p></div>
      <div class="caja"><h4>Encuestas</h4><p>Un estudio de una aseguradora con LaLiga da a Real Madrid el 61 % de la preferencia entre los equipos españoles en Colombia<sup data-f="chubb"></sup>. No se encontró una encuesta pública de hinchas por club europeo. <span class="tg nd">No disponible</span></p></div>
    </div>
  </div>
</div>
</section>

<!-- ============ 3 COMPETIDORES ============ -->
<section class="sec" id="competidores" data-n="03" data-t="Competidores">
<div class="cont">
  <span class="num">03</span>
  <h2>Competidores</h2>
  <p class="entr">El mercado de campus de marca ya está ocupado en Bogotá y empieza a repartirse en el resto del país. Hay tres amenazas de primer orden: el licenciatario de Juventus, el Campus Barça y los camps de la Federación.</p>

  <div class="rej c3">
    <div class="caja alerta"><h4>Juventus Academy Colombia</h4><p>Misma marca, licencia oficial, diez años de operación y clínica vacacional a COP 890.000. No es un competidor más: define si se puede operar.</p></div>
    <div class="caja"><h4>Campus Barça</h4><p>Formato gemelo (entrenadores enviados por el club), siete ciudades y COP 1.750.000. Es la prueba de que el modelo funciona y el rival directo en fechas y sedes.</p></div>
    <div class="caja"><h4>FCF Camps</h4><p>Marca Selección Colombia, jornada completa con almuerzo y el precio más alto: COP 2,2 millones con IVA. Opera en Bogotá y Barranquilla.</p></div>
  </div>

  <div data-barras="precioPrograma"></div>

  <h3>Fichas por competidor</h3>
  <div class="filtros no-imp">
    <label>Categoría<select id="fCat"><option value="">Todas</option><option value="d">Directo</option><option value="i">Indirecto</option><option value="s">Sustituto</option></select></label>
    <label>Tipo<select id="fTipo"></select></label>
    <label>Ciudad<select id="fCiu"></select></label>
    <label>Ordenar por<select id="fOrd"><option value="amenaza">Nivel de amenaza</option><option value="precio">Precio por día</option><option value="nombre">Nombre</option></select></label>
    <label>Buscar<input type="search" id="fBus" placeholder="Club, ciudad, palabra…"></label>
    <button id="compAbrir">Desplegar todos</button>
    <span class="cuenta" id="compCuenta"></span>
  </div>
  <div id="compLista"></div>
  <p class="peq">Directo: campus o camp de marca que compite por la misma semana de vacaciones. Indirecto: escuelas permanentes, academias y agencias que compiten por el presupuesto o la aspiración de la familia. Sustituto: vacacionales generales y programas gratuitos. Los seguidores de Instagram no se pudieron verificar en ningún caso (la lectura pública está bloqueada) y ningún competidor publica cifras de inscritos de 2026.</p>

  <h3>Lecturas</h3>
  <div class="rej c2">
    <div class="caja"><h4>El formato corto de pago no tiene referente local</h4><p>No se halló ninguna clínica de fútbol de uno a tres días con precio publicado en Colombia. Todos los campus de marca son de cinco o seis días. Un camp de selección de tres días sería un formato nuevo: ventaja para diferenciarse y reto para justificar el precio por día. <span class="tg conc">Conclusión propia</span></p></div>
    <div class="caja"><h4>El mercado tiene un problema de confianza</h4><p>La Federación alertó en 2024 de cupos falsos de sus camps<sup data-f="fcf-estafa"></sup>; en 2026 la Fiscalía judicializó a un falso presidente de club por estafar a 15 familias con pruebas en el exterior<sup data-f="estafa-fiscalia"></sup>; en 2024 se detuvo en España a un falso agente con 25 jugadores colombianos<sup data-f="estafa-arrasate"></sup>. La academia anterior de Barça cerró en 2020 con cientos de familias reclamando<sup data-f="barca-eltiempo"></sup>.</p></div>
    <div class="caja"><h4>Las ventanas de calendario ya tienen ocupantes</h4><p>Junio-julio (Barça, Federación, Juventus Academy, Italian Soccer Academy), diciembre-enero (Barça, Federación, LaLiga Camps), receso de octubre (Atlético de Madrid) y Semana Santa (Estudiantes de La Plata).</p></div>
    <div class="caja"><h4>Las escuelas de club no venden vacacionales</h4><p>Millonarios, Nacional, Santa Fe y Envigado viven de la mensualidad; ninguno publica un vacacional con precio. No compiten por la fecha y pueden ser canal de convocatoria.</p></div>
  </div>
</div>
</section>

<!-- ============ 4 META ADS ============ -->
<section class="sec" id="publicidad" data-n="04" data-t="Publicidad en Meta">
<div class="cont">
  <span class="num">04</span>
  <h2>Publicidad en Meta</h2>
  <p class="entr">Revisión de la biblioteca de anuncios de Meta para Colombia el 4 y 5 de noviembre de 2026: quién está pautando campamentos, academias y experiencias de fútbol, con qué mensajes y desde cuándo.</p>

  <div class="rej c2">
    <div class="caja verde"><h4>Lo que sí se puede observar</h4><ul><li>Que el anuncio existe y si está activo</li><li>La fecha en que empezó a circular</li><li>El texto, la pieza, el botón y el destino</li><li>Las plataformas donde se muestra</li></ul></div>
    <div class="caja alerta"><h4>Lo que no se puede conocer</h4><ul><li>Inversión, alcance e impresiones</li><li>Clics, conversaciones e inscripciones</li><li>Ventas y rentabilidad</li><li>El número de anuncios o su antigüedad <b>no indica resultados comerciales</b></li></ul></div>
  </div>

  <div class="rej c2"><div data-barras="adsActivos"></div><div data-barras="adsAnticipo"></div></div>

  <h3>Anunciantes detectados</h3>
  <div data-tabla="ads"></div>
  <p class="peq">Los enlaces abren la ficha pública de cada anuncio en la biblioteca de Meta. Las fechas marcadas como aproximadas se calcularon a partir de la marca de tiempo de la biblioteca y pueden variar un día.</p>

  <h3>Análisis</h3>
  <div class="rej c2">
    <div class="caja"><h4>Quién pauta y quién no</h4><p>Barça y la Fundación Real Madrid concentran el mayor número de piezas (unas 23 cada una, lanzadas a finales de octubre). Los modelos son distintos: Barça y LaLiga venden un camp corto en ciudades colombianas; Real Madrid lleva a la web global de su campus. También pautan la Federación y varias marcas argentinas. <b>Juventus Academy Colombia tiene un solo anuncio activo, de su academia permanente y solo en Instagram; no se vio ningún anuncio de camp de Juventus.</b> No se hallaron anuncios de PSG, Atlético de Madrid, Milan, Inter ni de las escuelas de los clubes colombianos<sup data-f="ads-lib"></sup>.</p></div>
    <div class="caja"><h4>Patrones de mensaje</h4><p>Promesa aspiracional ("vive el sueño", "entrena como los grandes de la Selección"), la metodología del club como argumento, escasez ("solo 70 cupos") y un anuncio por ciudad con sede y fechas. Predomina el video vertical corto. En academias locales domina la clase o semana de cortesía; en viajes y pruebas, "hazte ver" en España, Italia o Estados Unidos. Casi nadie publica el precio.</p></div>
    <div class="caja"><h4>Mecánicas de captación</h4><p>El destino más repetido es la conversación por WhatsApp (Barça, Juventus Academy Colombia y la mayoría de academias), coherente con que la aplicación llega a cerca del 75 % de la población<sup data-f="whatsapp"></sup>. Le siguen los formularios (LaLiga y agencias de becas) y, en menor medida, la web de inscripción (Real Madrid y la Federación).</p></div>
    <div class="caja"><h4>Anuncios más longevos</h4><p>Los que llevan más tiempo en circulación son de academias locales con clase de cortesía y WhatsApp (entre 159 y 589 días). Entre los camps, el más antiguo aún activo es el de la Federación (65 días). La permanencia indica que el anunciante lo mantiene encendido, no que venda: ninguna cifra de resultados es pública.</p></div>
    <div class="caja oro"><h4>Huecos aprovechables</h4><p>En los anuncios leídos solo LaLiga dice de dónde vienen sus entrenadores; Barça habla de "metodología", no de quién entrena. Ningún camp muestra testimonios de familias ni el programa del día, y casi todo termina en un chat sin pago directo. El espacio "hazte ver en Europa" lo ocupan agencias de pruebas, un terreno asociado a estafas donde una marca oficial puede diferenciarse por confianza.</p></div>
    <div class="caja"><h4>Ideas para diferenciarse</h4><ul><li>Mostrar en video a los entrenadores llegados de Italia, con nombre y cargo</li><li>Decir lo concreto: horario, edades, tamaño de grupo y qué incluye</li><li>Un anuncio por ciudad, con sede y fechas en la pieza</li><li>Captar por WhatsApp y cerrar en una página por sede con pago local</li><li>Empezar entre 8 y 10 semanas antes; diciembre es la ventana más saturada</li></ul></div>
  </div>
</div>
</section>

<!-- ============ 5 CIUDADES ============ -->
<section class="sec" id="ciudades" data-n="05" data-t="Ciudades">
<div class="cont">
  <span class="num">05</span>
  <h2>Análisis por ciudad</h2>
  <p class="entr">Ocho ciudades evaluadas con nueve criterios. Los puntajes de mercado y poder adquisitivo salen de reglas fijas sobre datos del DANE; los demás combinan datos y criterio propio, con la justificación visible al pasar sobre cada celda.</p>

  <div class="rej c3">
    <div class="caja oro"><h4>Las tres mejores</h4><p><b>Medellín, Bogotá y Cali.</b> Concentran el 68 % de la clase alta del país y las mejores sedes identificadas.</p></div>
    <div class="caja verde"><h4>Mejor perfil para un primer camp</h4><p><b>Medellín</b> es la que mejor encaja si no hay acuerdo con el licenciatario: segundo mercado, la mayor cultura futbolera y sin sede de Juventus Academy. <b>Bogotá</b> encajaría mejor de la mano del licenciatario.</p></div>
    <div class="caja"><h4>Segunda etapa y menos prioritarias</h4><p><b>Segunda etapa:</b> Cali (misma gira que Medellín) y Barranquilla. <b>Menos prioritarias al inicio:</b> Cartagena, Manizales y Pereira por separado; Bucaramanga y Cúcuta, por ser plazas del licenciatario.</p></div>
  </div>

  <div class="mapa-w">
    <div class="mapa" id="mapa"></div>
    <div class="ficha-ciudad" id="fichaCiudad"></div>
  </div>

  <h3>Matriz ponderada</h3>
  <p class="peq no-imp">Los pesos se pueden mover para probar otros criterios; el ranking, el mapa y la ficha se recalculan. Al hacer clic en una ciudad se abre su ficha.</p>
  <div class="filtros no-imp" style="display:block">
    <div class="pesos" id="mzPesos"></div>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <select id="mzRegion" aria-label="Filtrar por región"></select>
      <button id="mzReset">Restablecer los pesos</button>
      <span class="cuenta" id="mzSuma" style="margin-left:0"></span>
    </div>
  </div>
  <div class="escala"><span>Puntaje por criterio:</span><i class="h1"></i>1<i class="h2"></i>2<i class="h3"></i>3<i class="h4"></i>4<i class="h5"></i>5 <span>· más oscuro = más favorable</span></div>
  <div class="tabla-w" id="mzTabla"></div>
  <p class="peq"><span class="tg conc">Conclusión propia</span> Con los pesos propuestos, Medellín y Bogotá quedan prácticamente empatadas. Bogotá gana en mercado, ingreso, infraestructura y conexiones; pierde por ser la plaza más disputada y la sede del licenciatario. Si se llega a un acuerdo con él, el criterio de libertad de marca deja de restar y Bogotá pasa al primer lugar.</p>

  <h3>Lo que distingue a cada plaza</h3>
  <div class="rej c2">
    <div class="caja"><h4>Bogotá: el premio mayor, condicionado</h4><p>803 mil personas de clase alta, 424.426 alumnos en colegios privados<sup data-f="sed-bogota"></sup> y canchas públicas de fútbol 11 con tarifa publicada<sup data-f="idrd-tarifas"></sup>. También siete marcas con campus o academias, y 2.640 metros de altitud para entrenadores que llegan de Italia.</p></div>
    <div class="caja"><h4>Medellín: la mejor entrada sin conflicto</h4><p>Nacional y Medellín tienen la mayor asistencia a estadios del país<sup data-f="asist-claro,asist-win"></sup>; cada enero la ciudad recibe el Babyfútbol con 8.900 deportistas<sup data-f="baby-2025"></sup>; hay un colegio que publica el alquiler de sus canchas. En contra: Barça y LaLiga Camps ya venden allí.</p></div>
    <div class="caja"><h4>Cali: buena segunda sede de una gira</h4><p>Tercer mercado, costos bajos, colegios de Pance con varias canchas y vuelo directo a Miami desde diciembre de 2026<sup data-f="avianca-cali"></sup>. El torneo juvenil de la ciudad tiene el patrocinio principal disponible.</p></div>
    <div class="caja"><h4>Barranquilla: mucha afición, poca base</h4><p>La región que más busca a Juventus y sede de la Selección, pero con solo 47 mil personas de clase alta en toda el área metropolitana<sup data-f="dane-clases"></sup>, y con la Federación y Barça ya instalados.</p></div>
  </div>
</div>
</section>

<!-- ============ 6 ALIANZAS ============ -->
<section class="sec" id="alianzas" data-n="06" data-t="Alianzas">
<div class="cont">
  <span class="num">06</span>
  <h2>Alianzas estratégicas</h2>
  <p class="entr">Tres tipos de alianza que no deben mezclarse: la autorización de marca, que solo concede Juventus; la alianza comercial (sede, venta con comisión, patrocinio); y la deportiva (clínicas, visorías, becas).</p>

  <div class="caja alerta"><h4>Un punto para revisar primero: la licencia de Juventus</h4><p>Antes de acercarse a terceros en Colombia sería importante conocer, con el área de Juventus Academy, qué derechos tiene el operador colombiano: si la exclusividad es nacional o por ciudad y si cubre campamentos y vacacionales. Según la respuesta, el licenciatario podría ser el primer aliado (co-organizar o subcontratar) o un obstáculo. Ningún aliado local puede usar ni ceder la marca Juventus por su cuenta.</p></div>

  <div data-tabla="aliados"></div>
  <p class="peq">Se muestran únicamente contactos institucionales publicados en los sitios oficiales. No se contactó a ninguna entidad ni se envió ningún formulario durante la investigación. Los seguidores en redes no se pudieron verificar.</p>

  <div class="rej c3">
    <div class="caja"><h4>Colegios como sede</h4><p>Es el modelo que usa Barça: colegios bilingües, clubes sociales y universidades alquilan sus canchas a marcas europeas. Los mejores candidatos están en ciudades sin sede de Juventus Academy: San Ignacio (Medellín), Bolívar (Cali) y Karl C. Parrish (Barranquilla).</p></div>
    <div class="caja"><h4>Patrocinadores con vínculo previo</h4><p>Jeep, Allianz y Enel son socios vigentes de Juventus<sup data-f="a-partners"></sup> y operan en Colombia. La Cámara de Comercio Italiana agrupa a varias marcas afines<sup data-f="a-cci"></sup>. Toda activación exige el visto bueno de Juventus.</p></div>
    <div class="caja"><h4>Conflictos ya identificados</h4><p>Colsubsidio (Real Madrid), Compensar (LaLiga), Club Campestre de Cali y New Cambridge School (Barça), British International School (Real Madrid) e Internacional de Bogotá (Atlético de Madrid).</p></div>
  </div>
</div>
</section>

<!-- ============ 7 COMPRADOR ============ -->
<section class="sec" id="comprador" data-n="07" data-t="Perfil del comprador">
<div class="cont">
  <span class="num">07</span>
  <h2>Perfil del cliente y comportamiento de compra</h2>
  <p class="entr">Quién compra, cuándo decide, cómo busca y cómo paga. Los perfiles son construcciones propias apoyadas en la evidencia que se cita.</p>

  <div class="rej c2">
    <div class="caja oro"><h4>1. Familia de clase alta de Bogotá norte, la Sabana, El Poblado o Pance</h4><p>Ingreso del hogar superior a COP 20 millones al mes, hijos en colegios bilingües. Busca experiencia internacional, organización impecable y seguridad. Paga sin pedir cuotas. Compite con viajes al exterior en vacaciones. <b>Objeción:</b> "¿qué tiene esto que no tenga la academia local o un camp en Estados Unidos?".</p></div>
    <div class="caja"><h4>2. Familia de clase media-alta con hijo en escuela de fútbol</h4><p>Hogar de COP 10 a 20 millones al mes, colegio privado de COP 1 a 2,5 millones. Busca formación seria y una credencial de marca europea. Compara precios y pide cuotas. <b>Objeción:</b> el precio frente a la mensualidad de su escuela.</p></div>
    <div class="caja"><h4>3. Padre o madre con "proyecto futbolista"</h4><p>Hijo de 12 a 16 años en un club competitivo. El gancho es que lo vean y la posibilidad de ser seleccionado para Italia. Viaja entre ciudades para asistir. <b>Objeción:</b> desconfianza ante promesas de pruebas en Europa. Es el perfil que exige más cuidado en lo que se promete.</p></div>
    <div class="caja"><h4>4. Familia futbolera del Caribe</h4><p>Barranquilla y Cartagena: mucha afición y el mayor interés por Juventus del país, pero poca base de ingreso alto. Aquí se dice "campamento de verano". <b>Objeción:</b> el precio.</p></div>
  </div>
  <div class="caja"><h4>5. Familias de Juventus Academy Colombia</h4><p>Los padres de sus más de 1.200 jugadores<sup data-f="juve-7"></sup> ya compraron la marca y valorarían el contacto con entrenadores de Italia. Esa base pertenece al licenciatario: solo es alcanzable por alianza.</p></div>

  <h3>Cómo busca y cuándo decide</h3>
  <div class="rej c2">
    <div data-barras="estEscuela"></div>
    <div data-barras="estVac"></div>
  </div>
  <p class="fte">Fuente: Google Trends, Colombia, cinco años<sup data-f="trends-formatos"></sup>. Índices relativos a cada término; no son comparables entre los dos gráficos.</p>
  <div class="rej c3">
    <div class="caja"><h4>Casi nadie busca "campamento" ni "clínica" de fútbol</h4><p>El mercado dice "escuela de fútbol" (índice 46, frente a 3 de "academia") y "vacaciones recreativas". En el Caribe, "campamento de verano". Conviene tenerlo en cuenta al nombrar el producto.</p></div>
    <div class="caja"><h4>Dos momentos de compra</h4><p>La venta de mitad de año se decide en mayo y junio; la de fin de año, en octubre y noviembre. Las inscripciones a escuelas se concentran en enero.</p></div>
    <div class="caja"><h4>Se paga desde la cuenta, no con tarjeta</h4><p>Más del 60 % de los pagos digitales se hace por débito bancario (PSE)<sup data-f="pse"></sup>. Cobrar solo con tarjeta internacional, como en Estados Unidos, deja por fuera a la mayoría.</p></div>
  </div>

  <h3>Ventanas de calendario</h3>
  <div data-tabla="ventanas"></div>

  <h3>Canales</h3>
  <div class="rej c2">
    <div data-barras="alcance"></div>
    <div>
      <div class="caja"><h4>Lección de México</h4><p>En la campaña de Monterrey de 2026 solo pagó cerca del 5 % de las familias que llegaron por anuncios, frente a cerca del 19 % en Estados Unidos: el paso de pago estaba en inglés, pedía dirección con formato estadounidense y solo aceptaba tarjeta en un pago<sup data-f="int-mx"></sup>. Es una lección útil para Colombia: un pago adaptado al país desde el primer día.</p></div>
      <div class="caja"><h4>Lo que funciona en Estados Unidos</h4><p>El 52 % de las familias que se registran termina pagando y cada familia inscribe 1,14 niños en promedio<sup data-f="int-embudo"></sup>. Es el punto de comparación para medir una prueba en Colombia.</p></div>
    </div>
  </div>
</div>
</section>

<!-- ============ 8 PRECIOS ============ -->
<section class="sec" id="precios" data-n="08" data-t="Precios y viabilidad">
<div class="cont">
  <span class="num">08</span>
  <h2>Precios y viabilidad</h2>
  <p class="entr">El mercado ya paga entre COP 890.000 y 2,2 millones por una semana de campus de marca. La pregunta no es si hay disposición a pagar, sino si un camp corto con entrenadores traídos de Italia alcanza el volumen para cubrir sus costos fijos.</p>

  <div class="rej c2">
    <div data-barras="precioDia"></div>
    <div data-barras="precioHora"></div>
  </div>
  <div data-barras="intl"></div>

  <div class="rej c3">
    <div class="caja"><h4>La marca europea no se abarata en Colombia</h4><p>El Campus Barça cuesta COP 1.750.000 en Colombia y desde USD 549 (COP 1.776.300) en Estados Unidos<sup data-f="barca-us"></sup>, con la mitad de horas diarias en Colombia.</p></div>
    <div class="caja"><h4>El peso está fuerte</h4><p>La tasa pasó de COP 3.872 a 3.236 por dólar en un año<sup data-f="trm"></sup>. Un precio de USD 250 cuesta hoy COP 809.000; hace un año, COP 968.000. En 2026 la tasa se movió entre 3.048 y 3.798: conviene fijar el precio en pesos.</p></div>
    <div class="caja oro"><h4>Rango de precio de referencia</h4><p><b>COP 790.000 a 950.000</b> por un camp de tres días (COP 263.000 a 317.000 por día): por encima del licenciatario y de la academia italiana independiente, por debajo de Barça por día. <span class="tg conc">Conclusión propia</span></p></div>
  </div>

  <h3>Estructura de costos</h3>
  <div data-tabla="costos"></div>
  <p class="peq">Los honorarios de los entrenadores de Italia y la regalía de marca son datos internos que no estuvieron disponibles: se trabajó con supuestos que deben reemplazarse. Las tarifas de canchas privadas, pólizas y personal local requieren cotización escrita antes de comprometer un presupuesto.</p>

  <h3>Tres escenarios</h3>
  <p>Resultado operativo del evento por sede, antes de repartirlo entre Soccer Cage y el aliado local. Precio al público con IVA incluido.</p>
  <div class="esc" id="escCards"></div>

  <h3>Sensibilidad: precio y número de niños</h3>
  <p class="peq">Resultado por sede en millones de pesos, con la configuración del escenario moderado (tres días, tres entrenadores de Italia, gira de dos sedes, IVA de 19 %).</p>
  <div class="tabla-w" id="sens"></div>

  <h3>Simulador</h3>
  <div class="caja"><div class="sim" id="sim"></div></div>

  <div class="rej c2">
    <div class="caja"><h4>Lo que más mueve el resultado</h4><ul>
      <li><b>El volumen.</b> Los costos fijos de traer entrenadores no bajan con menos niños.</li>
      <li><b>El IVA.</b> Si el aliado es un club deportivo con reconocimiento, el servicio podría quedar excluido<sup data-f="et-476"></sup> y el resultado mejora en cerca de 16 puntos del precio.</li>
      <li><b>Las sedes por viaje.</b> Dos ciudades en la misma gira reparten cada tiquete de COP 4,3 millones.</li>
      <li><b>El formato.</b> Cinco días al precio de Barça cambian la ecuación, pero exigen más convocatoria.</li></ul></div>
    <div data-barras="costoNino"></div>
  </div>

  <h3>Marco legal y tributario</h3>
  <div data-tabla="legal"></div>
  <div class="rej c3">
    <div class="caja"><h4>Sin convenio con Estados Unidos</h4><p>Un honorario pagado desde Colombia a Soccer Cage LLC soporta 20 % de retención<sup data-f="et-408,dian-cdi"></sup>. Con Italia sí hay convenio: las regalías tienen tope de 10 %<sup data-f="cdi-italia"></sup>. Puede ser más eficiente que la licencia y los entrenadores se contraten con Italia.</p></div>
    <div class="caja"><h4>Entrenadores extranjeros</h4><p>Toda actividad remunerada requiere visa<sup data-f="migra-req"></sup>. Si los entrenadores siguen pagados por su empleador italiano cabría un permiso de corta estancia<sup data-f="migra-3167"></sup>; debe confirmarse con un abogado migratorio.</p></div>
    <div class="caja"><h4>Menores y datos</h4><p>Es obligatorio consultar el registro de inhabilidades por delitos sexuales de todo el personal con trato con menores<sup data-f="ley-1918"></sup>, y contar con autorización de los padres para datos e imagen<sup data-f="ley-1581"></sup>.</p></div>
  </div>
  <p class="peq">Este apartado resume normas para la decisión; no sustituye el concepto de un abogado y un contador colombianos. Quedan por confirmar: la exclusión de IVA para clubes deportivos, el tratamiento de los entrenadores bajo el convenio con Italia, la visa aplicable y las reglas de eventos fuera de Bogotá<sup data-f="dec-642"></sup>.</p>
</div>
</section>

<!-- ============ 9 DOFA ============ -->
<section class="sec" id="dofa" data-n="09" data-t="Oportunidades y DOFA">
<div class="cont">
  <span class="num">09</span>
  <h2>Oportunidades, diferenciación y DOFA</h2>

  <div class="rej c3">
    <div class="caja oro"><h4>Entrenadores de Italia</h4><p>El licenciatario trabaja con entrenadores locales. La presencia de entrenadores de Juventus Academy llegados de Italia es el único atributo que ningún actor de la marca ofrece hoy en el país.</p></div>
    <div class="caja oro"><h4>Selección oficial y clara</h4><p>En un mercado golpeado por promesas falsas, una selección con reglas escritas y respaldo del club convierte la desconfianza en ventaja.</p></div>
    <div class="caja oro"><h4>Formato corto</h4><p>Dos o tres días caben en un fin de semana largo o en el receso de octubre, sin competir con la semana completa de Barça o de la Federación ni con la escuela del niño.</p></div>
  </div>

  <div class="dofa">
    <div class="f"><h4>Fortalezas <small>internas</small></h4><ul>
      <li>Modelo probado en Estados Unidos, México y Puerto Rico</li>
      <li>Acceso a entrenadores de Juventus Academy desde Italia</li>
      <li>Costo publicitario bajo y medido: entre USD 11 y 26 por niño en Estados Unidos</li>
      <li>Sistema de registro, seguimiento por correo y mensajes ya montado</li>
      <li>Operación desde Miami, con vuelos directos a Bogotá, Medellín y Cali</li></ul></div>
    <div class="d"><h4>Debilidades <small>internas</small></h4><ul>
      <li>Sin derechos de marca confirmados para Colombia</li>
      <li>Sin entidad, base de datos ni pasarela de pago locales</li>
      <li>Costos fijos altos por evento: vuelos y estadía de los entrenadores</li>
      <li>Antecedente de México: bajo cierre de pagos con un proceso no adaptado al país</li>
      <li>Formato de dos o tres días sin referente de precio local</li></ul></div>
    <div class="o"><h4>Oportunidades <small>externas</small></h4><ul>
      <li>Demanda validada por Barça (siete ciudades) y por la Federación</li>
      <li>Medellín, Cali y Barranquilla sin sede del licenciatario</li>
      <li>Colegios privados con ocupación baja que buscan programas</li>
      <li>Peso fuerte: 16 % de apreciación en un año</li>
      <li>Un colombiano en la plantilla de Juventus desde agosto de 2026</li>
      <li>Socios de Juventus con operación en Colombia</li></ul></div>
    <div class="a"><h4>Amenazas <small>externas</small></h4><ul>
      <li>Licenciatario con diez años, clínica propia y posible exclusividad</li>
      <li>Barça con más marca, más ciudades y más pauta</li>
      <li>Baja demanda espontánea por Juventus</li>
      <li>IVA de 19 % y retención de 20 % sobre pagos a Estados Unidos</li>
      <li>Desconfianza por estafas y clubes locales que usan el nombre Juventus</li>
      <li>Natalidad en caída y volatilidad de la tasa de cambio</li></ul></div>
  </div>
</div>
</section>

<!-- ============ 10 ESTRATEGIA ============ -->
<section class="sec" id="estrategia" data-n="10" data-t="Estrategia de entrada">
<div class="cont">
  <span class="num">10</span>
  <h2>Estrategia de entrada</h2>
  <p class="entr">Un camino posible, por fases, con un punto de revisión al final de cada una. Ninguna fase comprometería inversión relevante antes de despejar la anterior.</p>

  <div class="fases">
    <div><span class="ff">Fase 1 · noviembre de 2026 a febrero de 2027</span><h4>Revisar la licencia</h4><ul>
      <li>Consulta formal a Juventus sobre el alcance de la licencia colombiana</li>
      <li>Si procede, primera conversación con el licenciatario: co-organización o reparto por ciudades</li>
      <li>Concepto de un tributarista y un abogado migratorio</li>
      <li>Cotizaciones escritas de dos o tres sedes en Medellín y Cali</li>
      <li><b>Punto de revisión:</b> que haya autorización escrita y un aliado que facture</li></ul></div>
    <div><span class="ff">Fase 2 · marzo a julio de 2027</span><h4>Prueba en dos sedes</h4><ul>
      <li>Gira de dos sedes en un viaje, en la ventana del 21 de junio al 2 de julio</li>
      <li>Medellín y Cali; o Bogotá con el licenciatario</li>
      <li>Camp de tres días, COP 790.000 a 950.000, pago local con PSE y cuotas</li>
      <li>Meta: 100 a 120 niños por sede</li>
      <li><b>Punto de revisión:</b> más de 100 niños por sede y cierre de pagos superior al 30 % de los registros</li></ul></div>
    <div><span class="ff">Fase 3 · agosto de 2027 en adelante</span><h4>Crecer o replantear</h4><ul>
      <li>Segunda gira en el receso de octubre o en diciembre</li>
      <li>Sumar Barranquilla y, con acuerdo, Bogotá</li>
      <li>Patrocinio de un socio de Juventus con operación local</li>
      <li>Evaluar un formato de cinco días y la experiencia en Italia</li>
      <li><b>Punto de revisión:</b> si la prueba no llega al equilibrio, convendría replantear el formato</li></ul></div>
  </div>

  <h3>Cómo podrían ser las campañas en Meta para la prueba</h3>
  <div class="tabla-w"><table>
    <thead><tr><th>Campaña</th><th>Público</th><th>Mensaje</th><th>Destino</th><th class="n">Presupuesto por sede</th></tr></thead>
    <tbody>
      <tr><td><b class="nm">1. Frío por ciudad</b></td><td>Padres de 30 a 55 años a 25 km de la sede; intereses de fútbol y colegios privados</td><td>Entrenadores de Juventus Academy que vienen de Italia; fechas y sede; cupos limitados</td><td>Página de la sede con registro y pago local</td><td class="n">COP 5,5 millones</td></tr>
      <tr><td><b class="nm">2. Conversación</b></td><td>Mismo público, optimizada a mensajes</td><td>Preguntas frecuentes: qué incluye, qué significa ser seleccionado</td><td>WhatsApp con respuesta el mismo día</td><td class="n">COP 2 millones</td></tr>
      <tr><td><b class="nm">3. Recordatorio</b></td><td>Visitantes de la página, registrados sin pago e interacción en redes</td><td>Cuenta regresiva y prueba social de ediciones en otros países</td><td>Enlace directo al pago</td><td class="n">COP 1,5 millones</td></tr>
      <tr><td><b class="nm">4. Aliado</b></td><td>Base de datos del colegio, torneo o academia aliada (correo y mensajes)</td><td>Invitación de la institución a sus familias</td><td>Página de la sede</td><td class="n">COP 1 millón</td></tr>
    </tbody></table></div>
  <p class="peq">Total: COP 10 millones por sede, equivalente a COP 83.000 por niño con 120 inscritos; está dentro del rango histórico de Soccer Cage. Arranque 60 días antes del evento, como en los camps de Estados Unidos. Piezas con niños en acción y entrenadores reales, un video del director del camp por ciudad, y el término "vacaciones" en el texto de mitad y fin de año. <span class="tg est">Estimación</span></p>
</div>
</section>

<!-- ============ 11 CONCLUSIÓN ============ -->
<section class="sec" id="conclusion" data-n="11" data-t="Conclusión ejecutiva">
<div class="cont">
  <span class="num">11</span>
  <h2>Conclusión ejecutiva</h2>
  <div class="qa">
    <div><h4>¿Vale la pena que Soccer Cage entre al mercado colombiano?</h4><p>Hay señales a favor: la demanda existe y el modelo ya lo valida un tercero. Antes de avanzar es importante revisar dos puntos: la marca ya tiene un operador con licencia en el país y la economía de un camp corto es ajustada.</p></div>
    <div><h4>¿Existe suficiente demanda para este tipo de experiencias?</h4><p>Sí. Barça llena campus en siete ciudades a COP 1.750.000 y la Federación repite ediciones a COP 2,2 millones. El mercado núcleo se estima en unos 134.000 niños en hogares de clase alta.</p></div>
    <div><h4>¿Cuál es el público objetivo más atractivo?</h4><p>Familias de clase alta y media-alta de Medellín, Bogotá y Cali con hijos de 8 a 14 años que ya pagan por una escuela de fútbol y estudian en colegio privado.</p></div>
    <div><h4>¿Qué competidores representan la mayor amenaza?</h4><p>Juventus Academy Colombia, porque es la misma marca; el Campus Barça, por formato, alcance y pauta; y los FCF Camps, por marca y precio.</p></div>
    <div><h4>¿Qué ciudades ofrecen las mejores oportunidades?</h4><p>Medellín aparece como la mejor opción para empezar sin conflicto de marca; Bogotá, si hay acuerdo con el licenciatario; Cali, como segunda sede de la misma gira; Barranquilla, en una segunda etapa.</p></div>
    <div><h4>¿Qué equipos o academias deberían contactarse primero?</h4><p>Lo primero sería hablar con Juventus y, con su visto bueno, con Juventus Academy Colombia. Después, sedes en ciudades libres como el Colegio San Ignacio (Medellín) y el Colegio Bolívar (Cali), y Sporturs como operador y canal.</p></div>
    <div><h4>¿Qué precio debería manejarse inicialmente?</h4><p>Un rango razonable estaría entre COP 790.000 y 950.000 por un camp de tres días, con IVA incluido, kit, pago por PSE y opción de cuotas. Equivale a USD 245 a 295 a la tasa actual.</p></div>
    <div><h4>¿Cuántos participantes se podrían captar razonablemente?</h4><p>Entre 100 y 120 niños por sede con un aliado local que convoque; entre 30 y 60 sin aliado, que es el rango de una primera edición de Soccer Cage en una ciudad nueva. En un año, de 300 a 1.000.</p></div>
    <div><h4>¿Qué inversión inicial podría requerirse?</h4><p>Una prueba de dos sedes mueve costos de unos COP 160 millones (cerca de USD 50.000). De ellos, cerca de COP 100 millones son costos fijos que se comprometen antes del evento (vuelos y estadía de los entrenadores, sedes, equipo de apoyo y publicidad); el resto depende del número de niños. La asesoría legal y tributaria previa no está incluida. Con 120 niños por sede el resultado queda cerca del equilibrio.</p></div>
    <div><h4>¿Cuál sería la estrategia más recomendable para el primer año?</h4><p>Un camino posible: revisar la licencia con Juventus, buscar un aliado local que facture y aporte convocatoria, y hacer una sola prueba de dos sedes a mitad de 2027 con metas claras para evaluar si vale la pena repetirla.</p></div>
  </div>

  <div class="veredicto">
    <div class="sello"><small>EN RESUMEN</small>Revisar antes de avanzar</div>
    <div>
      <p><b>Puntos por revisar:</b> la marca ya está licenciada a un tercero en Colombia, Bogotá tiene siete actores con campus o academias y una sede sola con 60 niños no cubriría sus costos.</p>
      <p><b>Señales a favor:</b> el formato está validado por otros clubes, el diferenciador de los entrenadores de Italia sigue libre y tres ciudades grandes no tienen sede del licenciatario.</p>
      <p><b>Un camino posible:</b> una consulta a Juventus, que no tiene costo, y según la respuesta una prueba acotada en dos sedes con aliado local. Si la licencia resultara exclusiva para todo el país, habría que replantear la entrada junto con el licenciatario.</p>
    </div>
  </div>
</div>
</section>

<!-- ============ RESUMEN ============ -->
<section class="sec" id="resumen" data-n="00" data-t="Executive summary">
<div class="cont">
  <span class="num">Executive summary</span>
  <h2>There is demand, and one key point to review: the license</h2>
  <div class="veredicto">
    <div class="sello"><small>KEY POINT</small>Review the license</div>
    <div>
      <p><b>It is important to review the license question before moving forward.</b> Juventus Academy Colombia already operates in Colombia, with an official license for the past ten years, venues in Bogotá, Cúcuta and Bucaramanga, and its own holiday clinic at COP 890,000 per week.</p>
      <p>It would be worth finding out from Juventus the scope of that license. From there, one option to consider would be a low-risk pilot in 2027, with a local partner and two venues in a single trip.</p>
    </div>
  </div>

  <div class="kpis" data-kpis="kpis"></div>
  <div class="leyenda-tg">
    <span><span class="tg dato">Verified data</span> figure published by the cited source</span>
    <span><span class="tg est">Estimate</span> own calculation with explicit assumptions</span>
    <span><span class="tg conc">Our conclusion</span> interpretation of the findings</span>
    <span><span class="tg nd">Not available</span> data that is not public</span>
  </div>

  <h3>The six main findings</h3>
  <div class="rej c2">
    <div class="caja alerta"><h4>1. Juventus already has a licensee in Colombia</h4><p>Juventus Academy Colombia has operated since 2015-2016, presents itself as "the only academy with an official European license in the country" and in 2026 launched a team in the Primera C<sup data-f="blu-primerac,icbf-juve"></sup>. It has already held ten camps in five cities<sup data-f="juve-7"></sup>. The territorial scope of its license is not public.</p></div>
    <div class="caja verde"><h4>2. The format has been validated by a third party</h4><p>Campus Barça, with coaches who travel from the club, went from one city in 2024 to seven in 2026 and charges COP 1,750,000 for five days<sup data-f="barca-sedes"></sup>. The Colombian Football Federation charges COP 1,850,000 plus VAT for the week of its FCF Camps<sup data-f="fcf-web"></sup>.</p></div>
    <div class="caja"><h4>3. Ability to pay is highly concentrated</h4><p>47% of the country's upper class lives in Bogotá; Bogotá, Medellín and Cali together account for 68%<sup data-f="dane-clases-cp"></sup>. Outside those three, no city exceeds 51,000 upper-class people.</p></div>
    <div class="caja"><h4>4. The Juventus brand carries little weight on its own</h4><p>In searches, Juventus receives between 6% and 10% of the interest of Real Madrid<sup data-f="trends-clubes"></sup>. For that reason, the sale would be better supported by the product (coaches from Italy, official selection) than by fandom.</p></div>
    <div class="caja"><h4>5. The differentiator is still unclaimed</h4><p>The licensee's clinic is run by local coaches; the only documented Italian visit, in 2024, was described as "the first in nine years"<sup data-f="neiva-juve"></sup>. No one today offers Juventus coaches arriving from Italy with an official selection.</p></div>
    <div class="caja oro"><h4>6. The economics are tight</h4><p>With the cost of bringing coaches from Italy and 19% VAT, a three-day camp at COP 850,000 needs about <b><span data-pe="1">—</span> children per venue</b> to break even, even when splitting the flights between two cities. A single venue with 60 children loses money. <span class="tg est">Estimate</span></p></div>
  </div>
</div>
</section>

<!-- ============ 1 OBJETIVO ============ -->
<section class="sec" id="objetivo" data-n="01" data-t="Objective and scope">
<div class="cont">
  <span class="num">01</span>
  <h2>Objective and scope</h2>
  <p class="entr">To determine whether Soccer Cage LLC should operate in Colombia by replicating the model it uses in the United States, Mexico and Puerto Rico: Juventus camps and clinics for children and young people aged 6 to 16, run by Juventus Academy coaches who travel from Italy.</p>
  <div class="rej c3">
    <div class="caja"><h4>What was assessed</h4><ul><li>Market size and profile</li><li>Direct, indirect and substitute competitors</li><li>Active advertising on Meta</li><li>Eight cities with a weighted matrix</li><li>Potential partners with public contact details</li><li>Prices, costs and three scenarios</li></ul></div>
    <div class="caja"><h4>Reference model</h4><ul><li>ID Camp in the United States: USD 225 for two days (COP 728,000)<sup data-f="juve-usa"></sup></li><li>ID Camp in Mexico: MX$4,675 for three days (COP 812,700)</li><li>Sales through Meta advertising, email and text messages</li><li>Venues rented from local partners</li></ul></div>
    <div class="caja"><h4>How to read the report</h4><ul><li>Each figure links to its source with a number in square brackets</li><li>The tags separate data, estimates and conclusions</li><li>Where a price or figure is not public, this is stated</li><li>The filters and tables are interactive</li></ul></div>
  </div>
</div>
</section>

<!-- ============ 2 MERCADO ============ -->
<section class="sec" id="mercado" data-n="02" data-t="Colombian market">
<div class="cont">
  <span class="num">02</span>
  <h2>The Colombian market</h2>
  <p class="entr">A country with 8.9 million children in the product's age range, but where only a narrow and highly concentrated segment can afford an internationally priced camp.</p>

  <h3>Size and trend</h3>
  <div class="rej c3">
    <div class="caja"><h4>8,908,288 children aged 6 to 16</h4><p>DANE projection for 2026; 6.3 million live in urban areas<sup data-f="dane-nac"></sup>. <span class="tg dato">Verified data</span></p></div>
    <div class="caja"><h4>32% fewer births</h4><p>From 647,521 live births in 2016 to 441,537 in 2025<sup data-f="nacimientos"></sup>. Children who are 6 to 10 years old today are the last large cohort: the favorable window is the next five to seven years. <span class="tg conc">Our conclusion</span></p></div>
    <div class="caja"><h4>8% play sports outside school</h4><p>Only 8% of children aged 6 to 12 play sports after school; in stratum 6 (the highest socioeconomic tier) the figure is 41%<sup data-f="deporte-8"></sup>. The product's audience is the one that already pays for sports. <span class="tg dato">Verified data</span></p></div>
  </div>

  <h3>Ability to pay</h3>
  <p>DANE defines the upper class as households with income above COP 5,081,953 per person per month: more than COP 20 million a month for a family of four. That is 1.7 million people, 3.3% of the country<sup data-f="dane-clases-cp"></sup>.</p>
  <div class="rej c2">
    <div data-barras="claseAlta"></div>
    <div data-barras="sam"></div>
  </div>
  <div data-tabla="demog"></div>
  <p class="fte">Sources: DANE, 2026 population projections<sup data-f="dane-pob"></sup>, 2025 social classes<sup data-f="dane-clases"></sup> and 2025 income and poverty lines<sup data-f="dane-pm"></sup>.. The poverty line is the monthly per-person cost of the basic basket of goods in each city; it is used as the official reference for the cost of living.</p>

  <h3>What target families already pay</h3>
  <div class="rej c3">
    <div class="caja"><h4>Elite schools</h4><p>Between COP 3.5 and 5.5 million a month at the most expensive schools in Bogotá, Medellín and Barranquilla<sup data-f="colegio-caro,colegios-caros"></sup>. A COP 850,000 camp is equivalent to less than one week of tuition.</p></div>
    <div class="caja"><h4>Local club soccer</h4><p>Annual enrollment fee of COP 360,000 to 590,000 and monthly fee of COP 210,000 to 540,000 at Millonarios, Nacional and Juventus Academy<sup data-f="mfc-matricula,nal-brochure,jac-img-mensual"></sup>.</p></div>
    <div class="caja"><h4>Private sector in contraction</h4><p>About 800 private schools have closed since 2020 and occupancy has fallen to around 60%, according to the industry association<sup data-f="colegios-cierre"></sup>. This is both a barrier and an opportunity: schools looking for programs to retain students.</p></div>
  </div>

  <h3>Market size</h3>
  <div class="tabla-w"><table>
    <thead><tr><th>Level</th><th>Definition</th><th class="n">Children aged 6 to 16</th><th>Type</th></tr></thead>
    <tbody>
      <tr><td><b class="nm">Total market</b></td><td>All children in the product's age range</td><td class="n">8,908,288</td><td><span class="tg dato">Verified data</span></td></tr>
      <tr><td><b class="nm">Core market</b></td><td>Upper-class households in seven metropolitan areas</td><td class="n">≈ 134,000</td><td><span class="tg est">Estimate</span></td></tr>
      <tr><td><b class="nm">Expanded market</b></td><td>Core plus the top 15% of the middle class</td><td class="n">≈ 337,000</td><td><span class="tg est">Estimate</span></td></tr>
      <tr class="dest"><td><b class="nm">Reachable in the first year</b></td><td>Between 1% and 3% of the core-market children who play organized soccer (assumption: 25%)</td><td class="n">300 to 1,000</td><td><span class="tg est">Estimate</span></td></tr>
    </tbody></table></div>
  <p class="peq">Cross-check: there are 2.08 million students in private schools<sup data-f="matricula-2025"></sup> and, according to the industry association, between 10% and 13% belong to strata 4, 5 and 6, that is, between 208,000 and 270,000 students. This is the same order of magnitude as the estimated market.</p>

  <h3>Interest in European clubs</h3>
  <div class="rej c2">
    <div data-barras="trends"></div>
    <div>
      <div class="caja"><h4>Interest follows Colombian players</h4><p>Bayern's search interest multiplied ninefold with the arrival of Luis Díaz; Liverpool lost it when he left<sup data-f="trends-clubes"></sup>. In August 2026 Juventus signed Colombian defender Jhon Lucumí<sup data-f="lucumi"></sup>: a local selling point that did not exist before, although it is not yet visible in searches.</p></div>
      <div class="caja"><h4>Where Juventus is searched for most</h4><p>On the Caribbean coast (Bolívar, Sucre, Atlántico and Córdoba), precisely where the upper class is smallest. In the interior, Bogotá and Valle are ahead of Antioquia.</p></div>
      <div class="caja"><h4>Surveys</h4><p>A study by an insurer with LaLiga gives Real Madrid 61% of the preference among Spanish teams in Colombia<sup data-f="chubb"></sup>. No public survey of fans by European club was found. <span class="tg nd">Not available</span></p></div>
    </div>
  </div>
</div>
</section>

<!-- ============ 3 COMPETIDORES ============ -->
<section class="sec" id="competidores" data-n="03" data-t="Competitors">
<div class="cont">
  <span class="num">03</span>
  <h2>Competitors</h2>
  <p class="entr">The branded-camp market is already occupied in Bogotá and is beginning to be divided up in the rest of the country. There are three first-order threats: the Juventus licensee, Campus Barça and the Federation's camps.</p>

  <div class="rej c3">
    <div class="caja alerta"><h4>Juventus Academy Colombia</h4><p>Same brand, official license, ten years of operation and a holiday clinic at COP 890,000. It is not just another competitor: it determines whether operating is possible.</p></div>
    <div class="caja"><h4>Campus Barça</h4><p>A twin format (coaches sent by the club), seven cities and COP 1,750,000. It is proof that the model works and the direct rival for dates and venues.</p></div>
    <div class="caja"><h4>FCF Camps</h4><p>Colombian national team brand, a full-day schedule with lunch and the highest price: COP 2.2 million including VAT. It operates in Bogotá and Barranquilla.</p></div>
  </div>

  <div data-barras="precioPrograma"></div>

  <h3>Competitor profiles</h3>
  <div class="filtros no-imp">

    <button id="compAbrir">Expand all</button>
