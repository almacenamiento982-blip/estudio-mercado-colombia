  <div id="compLista"></div>
  <p class="peq">Direct: a branded campus or camp that competes for the same holiday week. Indirect: permanent schools, academies and agencies that compete for the family's budget or aspiration. Substitute: general holiday programs and free programs. Instagram followers could not be verified in any case (public reading is blocked) and no competitor publishes 2026 enrollment figures.</p>

  <h3>Takeaways</h3>
  <div class="rej c2">
    <div class="caja"><h4>The short paid format has no local benchmark</h4><p>No soccer clinic of one to three days with a published price was found in Colombia. All branded camps run five or six days. A three-day selection camp would be a new format: an advantage for differentiation and a challenge in justifying the price per day. <span class="tg conc">Our conclusion</span></p></div>
    <div class="caja"><h4>The market has a trust problem</h4><p>In 2024 the Federation warned of fake places in its camps<sup data-f="fcf-estafa"></sup>; in 2026 the Attorney General's Office brought charges against a fake club president for defrauding 15 families with tryouts abroad<sup data-f="estafa-fiscalia"></sup>; in 2024 a fake agent was arrested in Spain with 25 Colombian players<sup data-f="estafa-arrasate"></sup>. Barça's previous academy closed in 2020 with hundreds of families filing claims<sup data-f="barca-eltiempo"></sup>.</p></div>
    <div class="caja"><h4>The calendar windows already have occupants</h4><p>June-July (Barça, the Federation, Juventus Academy, Italian Soccer Academy), December-January (Barça, the Federation, LaLiga Camps), the October school break (Atlético de Madrid) and Holy Week (Estudiantes de La Plata).</p></div>
    <div class="caja"><h4>Club schools do not sell holiday programs</h4><p>Millonarios, Nacional, Santa Fe and Envigado live off the monthly fee; none publishes a holiday program with a price. They do not compete for the date and can be a recruitment channel.</p></div>
  </div>
</div>
</section>

<!-- ============ 4 META ADS ============ -->
<section class="sec" id="publicidad" data-n="04" data-t="Advertising on Meta">
<div class="cont">
  <span class="num">04</span>
  <h2>Advertising on Meta</h2>
  <p class="entr">Review of the Meta Ad Library for Colombia on November 4 and 5, 2026: who is running ads for soccer camps, academies and experiences, with what messages and since when.</p>

  <div class="rej c2">
    <div class="caja verde"><h4>What can be observed</h4><ul><li>That the ad exists and whether it is active</li><li>The date it started running</li><li>The text, the creative, the button and the destination</li><li>The platforms where it is shown</li></ul></div>
    <div class="caja alerta"><h4>What cannot be known</h4><ul><li>Spend, reach and impressions</li><li>Clicks, conversations and enrollments</li><li>Sales and profitability</li><li>The number of ads or how long they have been running <b>does not indicate commercial results</b></li></ul></div>
  </div>

  <div class="rej c2"><div data-barras="adsActivos"></div><div data-barras="adsAnticipo"></div></div>

  <h3>Advertisers detected</h3>
  <div data-tabla="ads"></div>
  <p class="peq">The links open each ad's public record in the Meta Ad Library. Dates marked as approximate were calculated from the library's timestamp and may vary by one day.</p>

  <h3>Analysis</h3>
  <div class="rej c2">
    <div class="caja"><h4>Who advertises and who does not</h4><p>Barça and the Real Madrid Foundation account for the largest number of creatives (about 23 each, launched in late October). The models differ: Barça and LaLiga sell a short camp in Colombian cities; Real Madrid sends users to the global website of its campus. The Federation and several Argentine brands also run ads. <b>Juventus Academy Colombia has a single active ad, for its permanent academy and only on Instagram; no Juventus camp ad was seen.</b> No ads were found from PSG, Atlético de Madrid, Milan, Inter or the schools of the Colombian clubs<sup data-f="ads-lib"></sup>.</p></div>
    <div class="caja"><h4>Message patterns</h4><p>An aspirational promise ("live the dream", "train like the greats of the national team"), the club's methodology as a selling point, scarcity ("only 70 places") and one ad per city with venue and dates. Short vertical video predominates. Among local academies, the free trial class or week dominates; for trips and tryouts, "get seen" in Spain, Italy or the United States. Almost no one publishes the price.</p></div>
    <div class="caja"><h4>Lead-capture mechanics</h4><p>The most common destination is a WhatsApp conversation (Barça, Juventus Academy Colombia and most academies), consistent with the app reaching about 75% of the population<sup data-f="whatsapp"></sup>. Next come forms (LaLiga and scholarship agencies) and, to a lesser extent, the registration website (Real Madrid and the Federation).</p></div>
    <div class="caja"><h4>Longest-running ads</h4><p>The ads that have been running the longest belong to local academies with a free trial class and WhatsApp (between 159 and 589 days). Among camps, the oldest still active is the Federation's (65 days). Longevity indicates that the advertiser keeps the ad switched on, not that it sells: no results figures are public.</p></div>
    <div class="caja oro"><h4>Gaps that could be used</h4><p>In the ads reviewed, only LaLiga says where its coaches come from; Barça talks about "methodology", not about who does the coaching. No camp shows family testimonials or the daily program, and almost everything ends in a chat with no direct payment. The "get seen in Europe" space is occupied by tryout agencies, a territory associated with scams where an official brand can differentiate itself through trust.</p></div>
    <div class="caja"><h4>Ideas for differentiation</h4><ul><li>Show on video the coaches arriving from Italy, with name and role</li><li>State the specifics: schedule, ages, group size and what is included</li><li>One ad per city, with venue and dates in the creative</li><li>Capture leads through WhatsApp and close on a per-venue page with local payment</li><li>Start 8 to 10 weeks ahead; December is the most saturated window</li></ul></div>
  </div>
</div>
</section>

<!-- ============ 5 CIUDADES ============ -->

<div class="cont">
  <span class="num">05</span>
  <h2>City-by-city analysis</h2>
  <p class="entr">Eight cities assessed against nine criteria. The market and purchasing-power scores come from fixed rules applied to DANE data; the others combine data and the study's own judgment, with the rationale visible when hovering over each cell.</p>

  <div class="rej c3">
    <div class="caja oro"><h4>The top three</h4><p><b>Medellín, Bogotá and Cali.</b> They concentrate 68% of the country's upper class and the best venues identified.</p></div>
    <div class="caja verde"><h4>Best profile for a first camp</h4><p><b>Medellín</b> is the best fit if there is no agreement with the licensee: second-largest market, the strongest soccer culture and no Juventus Academy venue. <b>Bogotá</b> would fit better hand in hand with the licensee.</p></div>
    <div class="caja"><h4>Second stage and lower priority</h4><p><b>Second stage:</b> Cali (same tour as Medellín) and Barranquilla. <b>Lower priority at the outset:</b> Cartagena, Manizales and Pereira on their own; Bucaramanga and Cúcuta, as they are the licensee's markets.</p></div>
  </div>

  <p class="peq no-imp">The weights can be adjusted to test other criteria; the ranking, the map and the profile are recalculated. Clicking on a city opens its profile.</p>

  <p class="peq"><span class="tg conc">Our conclusion</span> With the proposed weights, Medellín and Bogotá are practically tied. Bogotá wins on market, income, infrastructure and connections; it loses for being the most contested market and the licensee's home base. If an agreement is reached with the licensee, the brand-freedom criterion stops counting against it and Bogotá moves into first place.</p>

  <h3>What sets each market apart</h3>
  <div class="rej c2">
    <div class="caja"><h4>Bogotá: the biggest prize, with conditions</h4><p>803,000 upper-class people, 424,426 students in private schools<sup data-f="sed-bogota"></sup> and public 11-a-side soccer fields with published rates<sup data-f="idrd-tarifas"></sup>. Also seven brands with camps or academies, and 2,640 meters of altitude for coaches arriving from Italy.</p></div>
    <div class="caja"><h4>Medellín: the best conflict-free entry</h4><p>Nacional and Medellín have the highest stadium attendance in the country<sup data-f="asist-claro,asist-win"></sup>; every January the city hosts the Babyfútbol tournament with 8,900 athletes<sup data-f="baby-2025"></sup>; there is a school that publishes the rental rates for its fields. On the downside: Barça and LaLiga Camps already sell there.</p></div>
    <div class="caja"><h4>Cali: a good second venue on a tour</h4><p>Third-largest market, low costs, schools in Pance with several fields and a direct flight to Miami from December 2026<sup data-f="avianca-cali"></sup>. The city's youth tournament has its main sponsorship available.</p></div>
    <div class="caja"><h4>Barranquilla: plenty of fans, a small base</h4><p>The region that searches for Juventus the most and home of the national team, but with only 47,000 upper-class people in the entire metropolitan area<sup data-f="dane-clases"></sup>, and with the Federation and Barça already established.</p></div>
  </div>
</div>
</section>

<!-- ============ 6 ALIANZAS ============ -->
<section class="sec" id="alianzas" data-n="06" data-t="Partnerships">
<div class="cont">
  <span class="num">06</span>
  <h2>Strategic partnerships</h2>
  <p class="entr">Three types of partnership that should not be mixed: brand authorization, which only Juventus can grant; the commercial partnership (venue, commission-based sales, sponsorship); and the sporting partnership (clinics, scouting sessions, scholarships).</p>

  <div class="caja alerta"><h4>A point to review first: the Juventus license</h4><p>Before approaching third parties in Colombia, it would be important to find out, with the Juventus Academy department, what rights the Colombian operator holds: whether exclusivity is national or by city and whether it covers camps and holiday programs. Depending on the answer, the licensee could be the first partner (co-organizing or subcontracting) or an obstacle. No local partner can use or assign the Juventus brand on its own.</p></div>

  <div data-tabla="aliados"></div>
  <p class="peq">Only institutional contacts published on official websites are shown. No organization was contacted and no form was submitted during the research. Social media followers could not be verified.</p>

  <div class="rej c3">
    <div class="caja"><h4>Schools as venues</h4><p>This is the model Barça uses: bilingual schools, social clubs and universities rent their fields to European brands. The best candidates are in cities with no Juventus Academy venue: San Ignacio (Medellín), Bolívar (Cali) and Karl C. Parrish (Barranquilla).</p></div>
    <div class="caja"><h4>Sponsors with an existing link</h4><p>Jeep, Allianz and Enel are current Juventus partners<sup data-f="a-partners"></sup> and operate in Colombia. The Italian Chamber of Commerce brings together several like-minded brands<sup data-f="a-cci"></sup>. Any activation requires Juventus's approval.</p></div>
    <div class="caja"><h4>Conflicts already identified</h4><p>Colsubsidio (Real Madrid), Compensar (LaLiga), Club Campestre de Cali and New Cambridge School (Barça), British International School (Real Madrid) and Internacional de Bogotá (Atlético de Madrid).</p></div>
  </div>
</div>
</section>

<!-- ============ 7 COMPRADOR ============ -->
<section class="sec" id="comprador" data-n="07" data-t="Buyer profile">
<div class="cont">
  <span class="num">07</span>
  <h2>Customer profile and buying behavior</h2>
  <p class="entr">Who buys, when they decide, how they search and how they pay. The profiles are constructs developed for this study, supported by the evidence cited.</p>

  <div class="rej c2">
    <div class="caja oro"><h4>1. Upper-class family from northern Bogotá, the Sabana, El Poblado or Pance</h4><p>Household income above COP 20 million a month, children in bilingual schools. Looks for an international experience, flawless organization and safety. Pays without asking for installments. Competes with trips abroad during the holidays. <b>Objection:</b> "what does this offer that the local academy or a camp in the United States does not?".</p></div>
    <div class="caja"><h4>2. Upper-middle-class family with a child in a soccer school</h4><p>Household of COP 10 to 20 million a month, private school costing COP 1 to 2.5 million. Looks for serious training and a European-brand credential. Compares prices and asks for installments. <b>Objection:</b> the price compared with the monthly fee of their soccer school.</p></div>
    <div class="caja"><h4>3. Father or mother with a "future pro player" project</h4><p>Child aged 12 to 16 at a competitive club. The hook is being seen and the possibility of being selected for Italy. Travels between cities to attend. <b>Objection:</b> distrust of promises of tryouts in Europe. This is the profile that requires the most care in what is promised.</p></div>
    <div class="caja"><h4>4. Soccer-loving family from the Caribbean</h4><p>Barranquilla and Cartagena: plenty of fans and the highest interest in Juventus in the country, but a small high-income base. Here people say "campamento de verano" (summer camp). <b>Objection:</b> the price.</p></div>
  </div>
  <div class="caja"><h4>5. Juventus Academy Colombia families</h4><p>The parents of its more than 1,200 players<sup data-f="juve-7"></sup> have already bought into the brand and would value contact with coaches from Italy. That base belongs to the licensee: it can only be reached through a partnership.</p></div>

  <h3>How they search and when they decide</h3>
  <div class="rej c2">
    <div data-barras="estEscuela"></div>
    <div data-barras="estVac"></div>
  </div>
  <p class="fte">Source: Google Trends, Colombia, five years<sup data-f="trends-formatos"></sup>. Indices are relative to each term; they are not comparable between the two charts.</p>
  <div class="rej c3">
    <div class="caja"><h4>Almost no one searches for a soccer "campamento" (camp) or "clínica" (clinic)</h4><p>The market says "escuela de fútbol" (soccer school), with an index of 46 versus 3 for "academia", and "vacaciones recreativas" (holiday activity camps). On the Caribbean coast, "campamento de verano". It is worth keeping this in mind when naming the product.</p></div>
    <div class="caja"><h4>Two buying moments</h4><p>The mid-year sale is decided in May and June; the year-end sale, in October and November. Enrollments in soccer schools are concentrated in January.</p></div>
    <div class="caja"><h4>Payment comes from the bank account, not by card</h4><p>More than 60% of digital payments are made by bank debit (PSE)<sup data-f="pse"></sup>. Charging only by international card, as in the United States, leaves out the majority.</p></div>
  </div>

  <h3>Calendar windows</h3>
  <div data-tabla="ventanas"></div>

  <h3>Channels</h3>
  <div class="rej c2">
    <div data-barras="alcance"></div>
    <div>
      <div class="caja"><h4>Lesson from Mexico</h4><p>In the 2026 Monterrey campaign only about 5% of the families who arrived through ads paid, compared with about 19% in the United States: the payment step was in English, asked for an address in US format and only accepted card payment in a single installment<sup data-f="int-mx"></sup>. It is a useful lesson for Colombia: a payment process adapted to the country from day one.</p></div>
      <div class="caja"><h4>What works in the United States</h4><p>52% of the families who register end up paying and each family enrolls 1.14 children on average<sup data-f="int-embudo"></sup>. This is the benchmark for measuring a pilot in Colombia.</p></div>
    </div>
  </div>
</div>
</section>

<!-- ============ 8 PRECIOS ============ -->
<section class="sec" id="precios" data-n="08" data-t="Pricing and feasibility">
<div class="cont">
  <span class="num">08</span>
  <h2>Pricing and feasibility</h2>
  <p class="entr">The market already pays between COP 890,000 and 2.2 million for a week of branded camp. The question is not whether there is willingness to pay, but whether a short camp with coaches brought from Italy reaches the volume needed to cover its fixed costs.</p>

  <div class="rej c2">
    <div data-barras="precioDia"></div>
    <div data-barras="precioHora"></div>
  </div>
  <div data-barras="intl"></div>

  <div class="rej c3">
    <div class="caja"><h4>The European brand does not get cheaper in Colombia</h4><p>Campus Barça costs COP 1,750,000 in Colombia and from USD 549 (COP 1,776,300) in the United States<sup data-f="barca-us"></sup>, with half the daily hours in Colombia.</p></div>
    <div class="caja"><h4>The peso is strong</h4><p>The exchange rate went from COP 3,872 to 3,236 per US dollar in one year<sup data-f="trm"></sup>. A price of USD 250 costs COP 809,000 today; a year ago, COP 968,000. In 2026 the rate moved between 3,048 and 3,798: it is advisable to set the price in pesos.</p></div>
    <div class="caja oro"><h4>Reference price range</h4><p><b>COP 790,000 to 950,000</b> for a three-day camp (COP 263,000 to 317,000 per day): above the licensee and the independent Italian academy, below Barça per day. <span class="tg conc">Our conclusion</span></p></div>
  </div>

  <h3>Cost structure</h3>
  <div data-tabla="costos"></div>
  <p class="peq">The fees of the coaches from Italy and the brand royalty are internal data that were not available: the analysis used assumptions that should be replaced. Rates for private fields, insurance policies and local staff require a written quote before committing a budget.</p>

  <h3>Three scenarios</h3>
  <p>Operating result of the event per venue, before splitting it between Soccer Cage and the local partner. Retail price with VAT included.</p>
  <div class="esc" id="escCards"></div>

  <h3>Sensitivity: price and number of children</h3>
  <p class="peq">Result per venue in millions of pesos, with the moderate-scenario configuration (three days, three coaches from Italy, two-venue tour, 19% VAT).</p>
  <div class="tabla-w" id="sens"></div>

  <h3>Simulator</h3>
  <div class="caja"><div class="sim" id="sim"></div></div>

  <div class="rej c2">
    <div class="caja"><h4>What moves the result the most</h4><ul>
      <li><b>Volume.</b> The fixed costs of bringing coaches do not fall with fewer children.</li>
      <li><b>VAT.</b> If the partner is a sports club with official recognition, the service could be excluded<sup data-f="et-476"></sup> and the result improves by about 16 points of the price.</li>
      <li><b>Venues per trip.</b> Two cities on the same tour split each COP 4.3 million airfare.</li>
      <li><b>Format.</b> Five days at Barça's price change the equation, but require more recruitment.</li></ul></div>
    <div data-barras="costoNino"></div>
  </div>

  <h3>Legal and tax framework</h3>
  <div data-tabla="legal"></div>
  <div class="rej c3">
    <div class="caja"><h4>No treaty with the United States</h4><p>A fee paid from Colombia to Soccer Cage LLC is subject to 20% withholding<sup data-f="et-408,dian-cdi"></sup>. With Italy there is a treaty: royalties are capped at 10%<sup data-f="cdi-italia"></sup>. It may be more efficient for the license and the coaches to be contracted with Italy.</p></div>
    <div class="caja"><h4>Foreign coaches</h4><p>Any paid activity requires a visa<sup data-f="migra-req"></sup>. If the coaches continue to be paid by their Italian employer, a short-stay permit might apply<sup data-f="migra-3167"></sup>; this should be confirmed with an immigration lawyer.</p></div>
    <div class="caja"><h4>Minors and data</h4><p>It is mandatory to check the registry of disqualifications for sexual offenses for all staff in contact with minors<sup data-f="ley-1918"></sup>, and to have parental authorization for data and image use<sup data-f="ley-1581"></sup>.</p></div>
  </div>
  <p class="peq">This section summarizes regulations for the decision; it does not replace the opinion of a Colombian lawyer and accountant. Still to be confirmed: the VAT exclusion for sports clubs, the treatment of the coaches under the treaty with Italy, the applicable visa and the rules for events outside Bogotá<sup data-f="dec-642"></sup>.</p>
</div>
</section>

<!-- ============ 9 DOFA ============ -->
<section class="sec" id="dofa" data-n="09" data-t="Opportunities and SWOT">
<div class="cont">
  <span class="num">09</span>
  <h2>Opportunities, differentiation and SWOT</h2>

  <div class="rej c3">
    <div class="caja oro"><h4>Coaches from Italy</h4><p>The licensee works with local coaches. The presence of Juventus Academy coaches arriving from Italy is the only attribute that no one operating under the brand offers in the country today.</p></div>
    <div class="caja oro"><h4>Clear, official selection</h4><p>In a market hit by false promises, a selection with written rules and the club's backing turns distrust into an advantage.</p></div>
    <div class="caja oro"><h4>Short format</h4><p>Two or three days fit into a long weekend or the October school break, without competing with the full week of Barça or the Federation or with the child's soccer school.</p></div>
  </div>

  <div class="dofa">
    <div class="f"><h4>Strengths <small>internal</small></h4><ul>
      <li>Model proven in the United States, Mexico and Puerto Rico</li>
      <li>Access to Juventus Academy coaches from Italy</li>
      <li>Low, measured advertising cost: between USD 11 and 26 per child in the United States</li>
      <li>Registration system and email and text-message follow-up already in place</li>
      <li>Operation from Miami, with direct flights to Bogotá, Medellín and Cali</li></ul></div>
    <div class="d"><h4>Weaknesses <small>internal</small></h4><ul>
      <li>No confirmed brand rights for Colombia</li>
      <li>No local entity, database or payment gateway</li>
      <li>High fixed costs per event: coaches' flights and accommodation</li>
      <li>Mexico precedent: low payment completion with a process not adapted to the country</li>
      <li>Two- or three-day format with no local price benchmark</li></ul></div>
    <div class="o"><h4>Opportunities <small>external</small></h4><ul>
      <li>Demand validated by Barça (seven cities) and by the Federation</li>
      <li>Medellín, Cali and Barranquilla with no licensee venue</li>
      <li>Private schools with low occupancy looking for programs</li>
      <li>Strong peso: 16% appreciation in one year</li>
      <li>A Colombian in the Juventus squad since August 2026</li>
      <li>Juventus partners with operations in Colombia</li></ul></div>
    <div class="a"><h4>Threats <small>external</small></h4><ul>
      <li>Licensee with ten years of operation, its own clinic and possible exclusivity</li>
      <li>Barça with more brand, more cities and more ads</li>
      <li>Low spontaneous demand for Juventus</li>
      <li>19% VAT and 20% withholding on payments to the United States</li>
      <li>Distrust due to scams and local clubs that use the Juventus name</li>
      <li>Falling birth rate and exchange-rate volatility</li></ul></div>
  </div>
</div>
</section>

<!-- ============ 10 ESTRATEGIA ============ -->
<section class="sec" id="estrategia" data-n="10" data-t="Entry strategy">
<div class="cont">
  <span class="num">10</span>
  <h2>Entry strategy</h2>
  <p class="entr">One possible path, in phases, with a review point at the end of each. No phase would commit significant investment before the previous one has been cleared.</p>

  <div class="fases">
    <div><span class="ff">Phase 1 · November 2026 to February 2027</span><h4>Review the license</h4><ul>
      <li>Formal inquiry to Juventus about the scope of the Colombian license</li>
      <li>If appropriate, a first conversation with the licensee: co-organization or a split by city</li>
      <li>Opinion from a tax specialist and an immigration lawyer</li>
      <li>Written quotes from two or three venues in Medellín and Cali</li>
      <li><b>Review point:</b> written authorization and a partner that can issue invoices</li></ul></div>
    <div><span class="ff">Phase 2 · March to July 2027</span><h4>Pilot in two venues</h4><ul>
      <li>Two-venue tour in one trip, in the window from June 21 to July 2</li>
      <li>Medellín and Cali; or Bogotá with the licensee</li>
      <li>Three-day camp, COP 790,000 to 950,000, local payment with PSE and installments</li>
      <li>Target: 100 to 120 children per venue</li>
      <li><b>Review point:</b> more than 100 children per venue and payment completion above 30% of registrations</li></ul></div>
    <div><span class="ff">Phase 3 · August 2027 onward</span><h4>Grow or rethink</h4><ul>
      <li>Second tour in the October school break or in December</li>
      <li>Add Barranquilla and, with an agreement, Bogotá</li>
      <li>Sponsorship from a Juventus partner with local operations</li>
      <li>Assess a five-day format and the experience in Italy</li>
      <li><b>Review point:</b> if the pilot does not reach break-even, it would be advisable to rethink the format</li></ul></div>
  </div>

  <h3>What the Meta campaigns for the pilot could look like</h3>
  <div class="tabla-w"><table>
    <thead><tr><th>Campaign</th><th>Audience</th><th>Message</th><th>Destination</th><th class="n">Budget per venue</th></tr></thead>
    <tbody>
      <tr><td><b class="nm">1. Cold, by city</b></td><td>Parents aged 30 to 55 within 25 km of the venue; soccer and private-school interests</td><td>Juventus Academy coaches coming from Italy; dates and venue; limited places</td><td>Venue page with registration and local payment</td><td class="n">COP 5.5 million</td></tr>
      <tr><td><b class="nm">2. Conversation</b></td><td>Same audience, optimized for messages</td><td>Frequently asked questions: what is included, what being selected means</td><td>WhatsApp with a same-day reply</td><td class="n">COP 2 million</td></tr>
      <tr><td><b class="nm">3. Reminder</b></td><td>Page visitors, registrants who have not paid and social media engagement</td><td>Countdown and social proof from editions in other countries</td><td>Direct link to payment</td><td class="n">COP 1.5 million</td></tr>
      <tr><td><b class="nm">4. Partner</b></td><td>Database of the partner school, tournament or academy (email and text messages)</td><td>Invitation from the institution to its families</td><td>Venue page</td><td class="n">COP 1 million</td></tr>
    </tbody></table></div>
  <p class="peq">Total: COP 10 million per venue, equivalent to COP 83,000 per child with 120 enrolled; this is within Soccer Cage's historical range. Launch 60 days before the event, as with the camps in the United States. Creatives with children in action and real coaches, a video of the camp director for each city, and the term "vacaciones" (holidays) in the mid-year and year-end ad copy. <span class="tg est">Estimate</span></p>
</div>
</section>

<!-- ============ 11 CONCLUSIÓN ============ -->
<section class="sec" id="conclusion" data-n="11" data-t="Executive conclusion">
<div class="cont">
  <span class="num">11</span>
  <h2>Executive conclusion</h2>
  <div class="qa">
    <div><h4>Is it worth it for Soccer Cage to enter the Colombian market?</h4><p>There are signals in favor: demand exists and the model is already validated by a third party. Before moving forward it is important to review two points: the brand already has a licensed operator in the country and the economics of a short camp are tight.</p></div>
    <div><h4>Is there enough demand for this type of experience?</h4><p>Yes. Barça fills camps in seven cities at COP 1,750,000 and the Federation repeats editions at COP 2.2 million. The core market is estimated at about 134,000 children in upper-class households.</p></div>
    <div><h4>Which target audience is the most attractive?</h4><p>Upper-class and upper-middle-class families in Medellín, Bogotá and Cali with children aged 8 to 14 who already pay for a soccer school and attend a private school.</p></div>
    <div><h4>Which competitors pose the greatest threat?</h4><p>Juventus Academy Colombia, because it is the same brand; Campus Barça, for format, reach and ads; and FCF Camps, for brand and price.</p></div>
    <div><h4>Which cities offer the best opportunities?</h4><p>Medellín appears to be the best option for starting without a brand conflict; Bogotá, if there is an agreement with the licensee; Cali, as the second venue of the same tour; Barranquilla, in a second stage.</p></div>
    <div><h4>Which teams or academies should be contacted first?</h4><p>The first step would be to speak with Juventus and, with its approval, with Juventus Academy Colombia. After that, venues in open cities such as Colegio San Ignacio (Medellín) and Colegio Bolívar (Cali), and Sporturs as operator and channel.</p></div>
    <div><h4>What price should be used initially?</h4><p>A reasonable range would be between COP 790,000 and 950,000 for a three-day camp, with VAT included, kit, payment by PSE and an installment option. This is equivalent to USD 245 to 295 at the current rate.</p></div>
    <div><h4>How many participants could reasonably be attracted?</h4><p>Between 100 and 120 children per venue with a local partner that drives recruitment; between 30 and 60 without a partner, which is the range of a first Soccer Cage edition in a new city. In one year, 300 to 1,000.</p></div>
    <div><h4>What initial investment might be required?</h4><p>A two-venue pilot involves costs of about COP 160 million (around USD 50,000). Of these, about COP 100 million are fixed costs committed before the event (coaches' flights and accommodation, venues, support staff and advertising); the rest depends on the number of children. Prior legal and tax advice is not included. With 120 children per venue the result is close to break-even.</p></div>
    <div><h4>What would be the most advisable strategy for the first year?</h4><p>One possible path: review the license with Juventus, look for a local partner that can issue invoices and contributes recruitment, and run a single two-venue pilot in mid-2027 with clear targets to assess whether it is worth repeating.</p></div>
  </div>

  <div class="veredicto">
    <div class="sello"><small>IN SUMMARY</small>Review before moving forward</div>
    <div>
      <p><b>Points to review:</b> the brand is already licensed to a third party in Colombia, Bogotá has seven players with camps or academies, and a single venue with 60 children would not cover its costs.</p>
      <p><b>Signals in favor:</b> the format is validated by other clubs, the differentiator of coaches from Italy is still unclaimed, and three large cities have no licensee venue.</p>
      <p><b>One possible path:</b> an inquiry to Juventus, which has no cost, and depending on the answer a limited pilot in two venues with a local partner. If the license turned out to be exclusive for the whole country, the entry would need to be rethought together with the licensee.</p>
    </div>
  </div>
</div>
</section>

  window._IDX = {}; window._URL = {};

/* R('id1','id2') → superíndices enlazados a la lista de fuentes */

/* FU('id1','id2') → lista {t,u} para el pie de una ficha */
function FU(){ var l=[]; for(var i=0;i<arguments.length;i++){ var f=_URL[arguments[i]]; if(f) l.push({t:f.t,u:f.u}); else console.warn('Fuente sin registrar:',arguments[i]); } return l; }

var $ = function(s,r){return (r||document).querySelector(s)};
var $$ = function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function cop(n){ if(n==null||isNaN(n)) return '—'; return 'COP ' + Math.round(n).toLocaleString(LOC); }
function copM(n){ if(n==null||isNaN(n)) return '—'; var a=Math.abs(n);
  if(a>=1e9) return 'COP ' + (n/1e9).toLocaleString(LOC,{maximumFractionDigits:2}) + T.milM;
  if(a>=1e6) return 'COP ' + (n/1e6).toLocaleString(LOC,{maximumFractionDigits:1}) + ' M';
  return cop(n); }
function num(n,d){ return (n==null||isNaN(n))?'—':Number(n).toLocaleString(LOC,{maximumFractionDigits:d==null?0:d}); }
function usd(n){ return 'USD ' + Math.round(n).toLocaleString(LOC); }
function pct(v){ return v + T.pct; }
function tg(k){ return '<span class="tg '+k+'">'+T.tg[k]+'</span>'; }
function ref(ids){ if(!ids) return ''; if(!Array.isArray(ids)) ids=[ids];
  return '<sup class="r">'+ids.map(function(i){return '<a href="#f'+i+'" title="'+T.verFuente+i+'">['+i+']</a>'}).join('')+'</sup>'; }
function enlaces(arr){ return (arr||[]).map(function(f){ return '<a href="'+esc(f.u)+'" target="_blank" rel="noopener">'+esc(f.t)+'</a>'; }).join(' · '); }

/* ---------- tooltip ---------- */
var tip = document.createElement('div'); tip.id='tip'; tip.hidden=true; document.body.appendChild(tip);
function tipOn(e,html){ tip.innerHTML=html; tip.hidden=false; tipMove(e); }
function tipMove(e){ var x=(e.clientX||0)+14, y=(e.clientY||0)+14, w=tip.offsetWidth, h=tip.offsetHeight;
  if(x+w>innerWidth-8) x=Math.max(8,(e.clientX||0)-w-12); if(y+h>innerHeight-8) y=Math.max(8,(e.clientY||0)-h-12);
  tip.style.left=x+'px'; tip.style.top=y+'px'; }
function tipOff(){ tip.hidden=true; }
function conTip(el,html){
  el.addEventListener('mouseenter',function(e){tipOn(e,html)}); el.addEventListener('mousemove',tipMove); el.addEventListener('mouseleave',tipOff);
  el.addEventListener('focus',function(){var r=el.getBoundingClientRect(); tipOn({clientX:r.left+r.width/2,clientY:r.bottom-6},html)}); el.addEventListener('blur',tipOff);
}

/* ---------- navegación e idioma ---------- */
function selectorIdioma(){
  return '<div class="idioma" role="group" aria-label="'+T.idioma+'"><button type="button" data-lang="es" class="'+(L==='es'?'act':'')+'" aria-pressed="'+(L==='es')+'">Español</button><button type="button" data-lang="en" class="'+(L==='en'?'act':'')+'" aria-pressed="'+(L==='en')+'">English</button></div>';
}
function nav(){
  var n = $('#nav'); if(!n) return;
  var secs = $$('section.sec[id]');
  n.innerHTML = secs.map(function(s,i){ return '<a href="#'+s.id+'"><i>'+(s.dataset.n||String(i+1).padStart(2,'0'))+'</i>'+esc(s.dataset.t||$('h2',s).textContent)+'</a>'; }).join('');
  var links = $$('a',n);
  links.forEach(function(a){ a.addEventListener('click',function(){ document.body.classList.remove('menu'); }); });
  if(observador) observador.disconnect();
  if('IntersectionObserver' in window){
    var vis = {};
    observador = new IntersectionObserver(function(es){
      es.forEach(function(e){ vis[e.target.id]=e.isIntersecting; });
      var act = null; secs.forEach(function(s){ if(!act && vis[s.id]) act=s.id; });
      if(act) links.forEach(function(a){ a.classList.toggle('act', a.getAttribute('href')==='#'+act); });
    },{rootMargin:'-10% 0px -70% 0px'});
    secs.forEach(function(s){ observador.observe(s); });
  }
  var bm=$('#btnMenu'); if(bm) bm.addEventListener('click',function(){ document.body.classList.toggle('menu'); });
  $$('[data-imprimir]').forEach(function(b){ b.addEventListener('click',function(){ $$('details.comp').forEach(function(d){d.open=true}); window.print(); }); });
  // selector de idioma: en la cabecera del índice y en la barra superior del celular
  if(window.DATA && window.DATA.es && window.DATA.en){
    var m=$('.lado .marca'); if(m) m.insertAdjacentHTML('beforeend', selectorIdioma());
    var b=$('.barra'); if(b && bm) bm.insertAdjacentHTML('beforebegin', selectorIdioma());
    $$('.idioma button').forEach(function(x){ x.addEventListener('click',function(){ if(x.dataset.lang!==L) arranca(x.dataset.lang, true); }); });
  }
}
document.addEventListener('click',function(e){ if(document.body.classList.contains('menu') && !e.target.closest('.lado') && !e.target.closest('#btnMenu')) document.body.classList.remove('menu'); });

/* ---------- KPIs ---------- */
function kpis(){
  $$('[data-kpis]').forEach(function(c){
    var lista = D[c.dataset.kpis] || [];
    c.innerHTML = lista.map(function(k){
      return '<div class="kpi"><span class="et">'+esc(k.et)+'</span><span class="val">'+k.val+(k.un?' <small>'+esc(k.un)+'</small>':'')+'</span>'+
        '<span class="nota">'+k.nota+'</span><span class="pie">'+tg(k.tipo||'dato')+(k.f?'<span>'+ref(k.f)+'</span>':'')+'</span></div>';
    }).join('');
  });
}

/* ---------- barras horizontales ----------
   <div data-barras="clave"></div>  →  D.graficos[clave] = {titulo, sub, unidad:'cop'|'num'|'pct'|'usd', max?, items:[{et, sub?, v, v2? (rango), cls?, tip?, f?}], leyenda?, fuente? } */
function fmtU(u,v){ return u==='cop'?cop(v):u==='copM'?copM(v):u==='pct'?pct(num(v,1)):u==='usd'?usd(v):num(v,1); }
function barras(){
  $$('[data-barras]').forEach(function(c){
    var g = (D.graficos||{})[c.dataset.barras]; if(!g){ c.hidden=true; return; }
    var max = g.max || Math.max.apply(null,g.items.map(function(i){return i.v2||i.v||0}))*1.04 || 1;
    function valor(i){ return i.txt || (i.v2? fmtU(g.unidad,i.v)+' – '+fmtU(g.unidad,i.v2) : fmtU(g.unidad,i.v)); }
    var h = '<div class="acc"><div><h4>'+esc(g.titulo)+'</h4><p class="sub">'+(g.sub||'')+'</p></div>'+
      '<button class="sec2 no-imp" data-tv>'+T.verTabla+'</button></div><div class="barras" role="img" aria-label="'+esc(g.titulo)+'">';
    g.items.forEach(function(i,ix){
      var w = Math.max(0,(i.v||0)/max*100);
      var marca = i.v2 ? '<span class="b" style="left:'+w+'%;width:'+Math.max(1,(i.v2-i.v)/max*100)+'%;border-radius:4px"></span>' : '<span class="b" style="width:'+w+'%"></span>';
      h += '<div class="bf '+(i.cls||'')+'" tabindex="0" data-i="'+ix+'"><span class="et">'+esc(i.et)+(i.sub?'<small>'+esc(i.sub)+'</small>':'')+'</span><span class="pista">'+marca+'</span><span class="v">'+valor(i)+'</span></div>';
    });
    h += '</div>';
    if(g.leyenda) h += '<div class="ley">'+g.leyenda.map(function(l){return '<span><i style="background:'+l.c+'"></i>'+esc(l.t)+'</span>'}).join('')+'</div>';
    h += '<div class="tabla-w" hidden style="margin-top:10px"><table><thead><tr><th>'+esc(g.colEt||T.concepto)+'</th><th class="n">'+esc(g.colV||T.valor)+'</th><th>'+T.nota+'</th></tr></thead><tbody>'+
      g.items.map(function(i){ return '<tr><td>'+esc(i.et)+(i.sub?' <small>('+esc(i.sub)+')</small>':'')+'</td><td class="n">'+valor(i)+'</td><td>'+(i.tip||'')+(i.f?ref(i.f):'')+'</td></tr>'; }).join('')+'</tbody></table></div>';
    if(g.fuente) h += '<p class="fte" style="margin:10px 0 0;max-width:none">'+g.fuente+'</p>';
    c.classList.add('graf'); c.innerHTML = h;
    $$('.bf',c).forEach(function(el){ var i=g.items[+el.dataset.i]; conTip(el,'<b>'+esc(i.et)+'</b>'+valor(i)+(i.tip?'<br>'+i.tip:'')); });
    var b=$('[data-tv]',c), t=$('.tabla-w',c);
    b.addEventListener('click',function(){ t.hidden=!t.hidden; b.textContent = t.hidden?T.verTabla:T.ocultarTabla; });
  });
}

/* ---------- competidores ---------- */
function amenaza(n){ var h='<span class="amz" title="'+T.amenaza+n+T.de5+'">'; for(var i=1;i<=5;i++) h+='<i class="'+(i<=n?'on':'')+'"></i>'; return h+'</span>'; }
function competidores(){
  var cont = $('#compLista'); if(!cont || !D.competidores) return;
  var fTipo=$('#fTipo'), fCat=$('#fCat'), fCiu=$('#fCiu'), fBus=$('#fBus'), fOrd=$('#fOrd'), cuenta=$('#compCuenta');
  var tipos={}, ciudades={};
  D.competidores.forEach(function(c){ tipos[c.tipo]=1; (c.ciudades||[]).forEach(function(x){ciudades[x]=1}); });
  fTipo.innerHTML = '<option value="">'+T.todos+'</option>'+Object.keys(tipos).sort().map(function(t){return '<option>'+esc(t)+'</option>'}).join('');
  fCiu.innerHTML = '<option value="">'+T.todas+'</option>'+Object.keys(ciudades).sort().map(function(t){return '<option>'+esc(t)+'</option>'}).join('');
  function pinta(){
    var t=fTipo.value, ca=fCat.value, ci=fCiu.value, q=(fBus.value||'').toLowerCase(), o=fOrd.value;
    var l = D.competidores.filter(function(c){
      return (!t||c.tipo===t) && (!ca||c.cat===ca) && (!ci||(c.ciudades||[]).indexOf(ci)>=0 || (c.ciudades||[]).indexOf(T.nacional)>=0 && ci) &&
        (!q || JSON.stringify(c).toLowerCase().indexOf(q)>=0);
    });
    l.sort(function(a,b){
      if(o==='precio') return (b.precioDia||0)-(a.precioDia||0);
      if(o==='nombre') return a.nombre.localeCompare(b.nombre,L);
      return (b.amenaza||0)-(a.amenaza||0) || a.nombre.localeCompare(b.nombre,L);
    });
    cuenta.textContent = l.length+T.de+D.competidores.length+T.competidores;
    cont.innerHTML = l.map(function(c){
      var cs=(c.campos||[]).filter(function(x){return x&&x[1]}), mitad=Math.ceil(cs.length/2);
      function col(l){ return '<dl>'+l.map(function(x){return '<dt>'+x[0]+'</dt><dd>'+x[1]+'</dd>'}).join('')+'</dl>'; }
      return '<details class="comp"><summary>'+
        '<span class="nm">'+esc(c.nombre)+'<small class="peq">'+esc(c.tipo)+(c.club?' · '+esc(c.club):'')+'</small></span>'+
        '<span class="oc peq">'+esc((c.ciudades||[]).join(', '))+'</span>'+
        '<span class="oc pr">'+(c.precioTxt||'<span class="peq">'+T.sinPrecio+'</span>')+'</span>'+
        '<span class="oc"><span class="chip '+c.cat+'">'+T.cat[c.cat]+'</span><br>'+amenaza(c.amenaza||0)+'</span>'+
        '<span class="fl">▶</span></summary><div class="cuerpo">'+col(cs.slice(0,mitad))+col(cs.slice(mitad))+
        '<div class="ftes"><b>'+T.amenaza+(c.amenaza||0)+T.de5+'.</b> '+(c.amz||'')+'<br><b>'+T.fuentes+'</b> '+enlaces(c.fuentes)+'</div></div></details>';
    }).join('') || '<p class="peq">'+T.ninguno+'</p>';
  }
  [fTipo,fCat,fCiu,fOrd].forEach(function(s){ s.addEventListener('change',pinta); });
  fBus.addEventListener('input',pinta);
  var bt=$('#compAbrir'); if(bt) bt.addEventListener('click',function(){ var ds=$$('details.comp',cont), ab=ds.some(function(d){return !d.open}); ds.forEach(function(d){d.open=ab}); bt.textContent = ab?T.contraer:T.desplegar; });
  pinta();
}

/* ---------- tablas genéricas con filtro ----------
   <div data-tabla="clave"></div> → D.tablas[clave] = {cols:[{t, k, cls?, ord?}], filas:[{...}], filtros?:[{k, et}], buscar?:true} */
function tablas(){
  $$('[data-tabla]').forEach(function(c){
    var TB=(D.tablas||{})[c.dataset.tabla]; if(!TB){ c.hidden=true; return; }
    var est={ord:null,dir:1,f:{},q:''};
    var h='';
    if(TB.filtros||TB.buscar){
      h+='<div class="filtros no-imp">';
      (TB.filtros||[]).forEach(function(f){
        var vals={}; TB.filas.forEach(function(r){ var v=r[f.k]; (Array.isArray(v)?v:[v]).forEach(function(x){ if(x) vals[x]=1; }); });
        h+='<label>'+esc(f.et)+'<select data-fk="'+f.k+'"><option value="">'+(f.todos||T.todos)+'</option>'+Object.keys(vals).sort().map(function(v){return '<option>'+esc(v)+'</option>'}).join('')+'</select></label>';
      });
      if(TB.buscar) h+='<label>'+T.buscar+'<input type="search" placeholder="'+T.buscarPh+'"></label>';
      h+='<span class="cuenta"></span></div>';
    }
    h+='<div class="tabla-w"><table><thead><tr>'+TB.cols.map(function(col,i){return '<th class="'+(col.cls||'')+'"'+(col.ord?' data-ord="'+i+'"':'')+'>'+col.t+'</th>'}).join('')+'</tr></thead><tbody></tbody></table></div>';
    c.innerHTML=h;
    var tb=$('tbody',c), cu=$('.cuenta',c);
    function val(r,col){ var v=r[col.k]; return v==null?'':v; }
    function pinta(){
      var l=TB.filas.filter(function(r){
        for(var k in est.f){ if(est.f[k]){ var v=r[k]; if(Array.isArray(v)? v.indexOf(est.f[k])<0 : v!==est.f[k]) return false; } }
        return !est.q || JSON.stringify(r).toLowerCase().indexOf(est.q)>=0;
      });
      if(est.ord!=null){ var col=TB.cols[est.ord], k=col.ordK||col.k;
        l=l.slice().sort(function(a,b){ var x=a[k],y=b[k]; if(typeof x==='number'||typeof y==='number') return ((x||0)-(y||0))*est.dir; return String(x||'').localeCompare(String(y||''),L)*est.dir; }); }
      tb.innerHTML=l.map(function(r){ return '<tr class="'+(r._cls||'')+'">'+TB.cols.map(function(col){ return '<td class="'+(col.cls||'')+'">'+val(r,col)+'</td>'; }).join('')+'</tr>'; }).join('') || '<tr><td colspan="'+TB.cols.length+'" class="peq">'+T.sinRes+'</td></tr>';
      if(cu) cu.textContent=l.length+T.de+TB.filas.length;
    }
    $$('select[data-fk]',c).forEach(function(s){ s.addEventListener('change',function(){ est.f[s.dataset.fk]=s.value; pinta(); }); });
    var b=$('input[type=search]',c); if(b) b.addEventListener('input',function(){ est.q=b.value.toLowerCase(); pinta(); });
    $$('th[data-ord]',c).forEach(function(th){ th.addEventListener('click',function(){ var i=+th.dataset.ord;
      if(est.ord===i) est.dir*=-1; else { est.ord=i; est.dir = TB.cols[i].cls&&TB.cols[i].cls.indexOf('n')>=0 ? -1 : 1; }
      $$('th[data-ord]',c).forEach(function(x){x.classList.remove('asc','desc')}); th.classList.add(est.dir>0?'asc':'desc'); pinta(); }); });
    pinta();
  });
}

/* ---------- ciudades: matriz ponderada + mapa ---------- */
function ciudades(){
  var C=D.ciudades, CR=D.criterios; if(!C||!CR||!$('#mzTabla')) return;
  var pesos={}; CR.forEach(function(c){ pesos[c.k]=c.peso; });
  var sel = null, fReg='';
  function total(ci){ var s=0,w=0; CR.forEach(function(c){ s+=(ci.p[c.k]||0)*pesos[c.k]; w+=pesos[c.k]; }); return w? s/w*20 : 0; } // escala 0-100
  function orden(){ return C.filter(function(c){return !fReg||c.region===fReg}).map(function(c){ return {c:c,t:total(c)}; }).sort(function(a,b){return b.t-a.t}); }
  function hcls(v){ return 'h'+Math.max(1,Math.min(5,Math.round(v))); }
  var pw=$('#mzPesos');
  pw.innerHTML = CR.map(function(c){ return '<label><b><span>'+esc(c.t)+'</span><span data-pv="'+c.k+'">'+pct(c.peso)+'</span></b><input type="range" min="0" max="40" step="5" value="'+c.peso+'" data-pk="'+c.k+'" aria-label="'+T.pesoDe+esc(c.t)+'"></label>'; }).join('');
  $$('input[data-pk]',pw).forEach(function(r){ r.addEventListener('input',function(){ pesos[r.dataset.pk]=+r.value; $('[data-pv="'+r.dataset.pk+'"]',pw).textContent=pct(r.value); pinta(); }); });
  var br=$('#mzReset'); if(br) br.addEventListener('click',function(){ CR.forEach(function(c){ pesos[c.k]=c.peso; var r=$('input[data-pk="'+c.k+'"]',pw); r.value=c.peso; $('[data-pv="'+c.k+'"]',pw).textContent=pct(c.peso); }); pinta(); });
  var fr=$('#mzRegion');
  if(fr){ var regs={}; C.forEach(function(c){regs[c.region]=1}); fr.innerHTML='<option value="">'+T.regiones+'</option>'+Object.keys(regs).sort().map(function(r){return '<option>'+esc(r)+'</option>'}).join(''); fr.addEventListener('change',function(){ fReg=fr.value; pinta(); }); }

  var mp=$('#mapa'), W=520, H=640, lon0=-79.6, lon1=-66.5, lat0=-4.6, lat1=13.0;
  function px(lon){ return (lon-lon0)/(lon1-lon0)*W; } function py(lat){ return (lat1-lat)/(lat1-lat0)*H; }
  function mapa(l){
    var poly=(D.contorno||[]).map(function(p,i){return (i?'L':'M')+px(p[0]).toFixed(1)+' '+py(p[1]).toFixed(1)}).join(' ')+'Z';
    var h='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+T.mapaAria+'"><path class="pais" d="'+poly+'"/>';
    l.slice().reverse().forEach(function(o){ var c=o.c, r=7+o.t/100*15, pos=l.indexOf(o), tier = pos<3?'t1':(pos<6?'t2':'t3');
      var dx=c.dx!=null?c.dx:r+5, dy=c.dy!=null?c.dy:4, anc=c.anc||'start';
      h+='<g class="pt '+tier+(sel===c.nombre?' sel':'')+'" data-c="'+esc(c.nombre)+'" tabindex="0" role="button" aria-label="'+esc(c.nombre)+', '+T.puntaje+' '+num(o.t,1)+'"><circle cx="'+px(c.lon).toFixed(1)+'" cy="'+py(c.lat).toFixed(1)+'" r="'+r.toFixed(1)+'"/><text x="'+(px(c.lon)+dx).toFixed(1)+'" y="'+(py(c.lat)+dy).toFixed(1)+'" text-anchor="'+anc+'">'+esc(c.nombre)+'</text></g>'; });
    h+='</svg><div class="ley" style="margin:6px 8px 4px"><span><i style="background:var(--oro);border-radius:50%"></i>'+T.p13+'</span><span><i style="background:var(--s1);border-radius:50%"></i>'+T.p46+'</span><span><i style="background:var(--gris-m);border-radius:50%"></i>'+T.p78+'</span><span>'+T.tamano+'</span></div>';
    mp.innerHTML=h;
    $$('.pt',mp).forEach(function(g){ var o=l.filter(function(x){return x.c.nombre===g.dataset.c})[0];
      conTip(g,'<b>'+esc(o.c.nombre)+' · '+num(o.t,1)+' / 100</b>'+esc(o.c.resumen||''));
      g.addEventListener('click',function(){ sel=o.c.nombre; pinta(); });
      g.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); sel=o.c.nombre; pinta(); } }); });
  }
  function ficha(l){
    var o=l.filter(function(x){return x.c.nombre===sel})[0]||l[0]; if(!o){ $('#fichaCiudad').innerHTML=''; return; }
    var c=o.c, pos=l.indexOf(o)+1;
    var h='<span class="num">'+T.puesto+pos+T.de+l.length+' · '+esc(c.region)+'</span><h4>'+esc(c.nombre)+'</h4><div class="val" style="font:700 30px/1.2 var(--txt);letter-spacing:-.02em">'+num(o.t,1)+' <small style="font-size:14px;color:var(--tinta2);font-weight:600">/ 100</small></div><p class="peq" style="margin:6px 0 0">'+(c.resumen||'')+'</p><dl>';
    (c.ficha||[]).forEach(function(f){ h+='<dt>'+esc(f[0])+'</dt><dd>'+f[1]+'</dd>'; });
    h+='</dl>'; $('#fichaCiudad').innerHTML=h;
  }
  function tabla(l){
    var h='<table class="mz"><thead><tr><th>#</th><th>'+T.ciudad+'</th>'+CR.map(function(c){return '<th class="rot" title="'+esc(c.desc||'')+'">'+esc(c.t)+'<small>'+pct(pesos[c.k])+'</small></th>'}).join('')+'<th class="n">'+T.puntajeCol+'</th></tr></thead><tbody>';
    l.forEach(function(o,i){ var c=o.c;
      h+='<tr class="'+(i<3?'dest':'')+'" data-c="'+esc(c.nombre)+'" style="cursor:pointer"><td class="n">'+(i+1)+'</td><td><b class="nm">'+esc(c.nombre)+'</b><br><small>'+esc(c.region)+'</small></td>'+
        CR.map(function(cr){ var v=c.p[cr.k]; return '<td class="h '+hcls(v)+'" title="'+esc(cr.t)+': '+v+T.de5+(c.just&&c.just[cr.k]?' — '+esc(c.just[cr.k]):'')+'">'+num(v,1)+'</td>'; }).join('')+
        '<td class="tot">'+num(o.t,1)+'</td></tr>'; });
    h+='</tbody></table>'; $('#mzTabla').innerHTML=h;
    $$('#mzTabla tbody tr').forEach(function(tr){ tr.addEventListener('click',function(){ sel=tr.dataset.c; pinta(); var f=$('#fichaCiudad'); if(f && innerWidth<900) f.scrollIntoView({block:'nearest'}); }); });
  }
  function pinta(){ var l=orden(); if(!sel || !l.some(function(o){return o.c.nombre===sel})) sel=l[0]&&l[0].c.nombre; mapa(l); ficha(l); tabla(l);
    var s=0; CR.forEach(function(c){s+=pesos[c.k]}); var av=$('#mzSuma'); if(av) av.textContent=T.suma+pct(s)+(s!==100?T.normaliza:''); }
  pinta();
}

/* ---------- escenarios y simulador ---------- */
function calc(p){
  var M=D.modelo, sedes=p.sedes||1, iva=(p.iva==null?M.ivaPct:p.iva), reg=(p.regalia==null?M.regaliaPct:p.regalia);
  var bruto=p.ninos*p.precio, ivaV=bruto*iva/(100+iva), ing=bruto-ivaV;
  var staffLocal=Math.ceil(p.ninos/M.ratioLocal), noches=p.dias+1+2/sedes;
  var c={};
  c.coaches = p.coachesIt*(M.vueloCoach/sedes + (M.hotelNoche+M.viaticoDia)*noches + M.honorarioDiaCoach*p.dias) + M.vanDia*(p.dias+1);
  c.local = staffLocal*M.honorarioDiaLocal*p.dias + M.apoyoDia*p.dias;
  c.sede = M.sedeDia*p.dias;
  c.kit = p.ninos*M.kitNino;
  c.varios = p.ninos*(M.seguroNino+M.refrigerioDia*p.dias) + M.fijosEvento;
  c.mkt = p.mkt;
  c.pasarela = bruto*M.pasarelaPct/100;
  c.licencia = ing*reg/100;
  c.impuestos = ing*M.icaPct/100;
  var tot=0; for(var k in c) tot+=c[k];
  var fijo = c.coaches + M.apoyoDia*p.dias + c.sede + M.fijosEvento + c.mkt;
  var contrib = p.precio/(1+iva/100)*(1-(reg+M.icaPct)/100) - p.precio*M.pasarelaPct/100 - M.kitNino - M.seguroNino - M.refrigerioDia*p.dias - M.honorarioDiaLocal*p.dias/M.ratioLocal;
  return {bruto:bruto, iva:ivaV, ing:ing, c:c, tot:tot, util:ing-tot, margen: ing?(ing-tot)/ing*100:0, pe: contrib>0?Math.ceil(fijo/contrib):null, staffLocal:staffLocal};
}
window.calcEscenario = calc;
function filasCostos(r){ var h='<dt>'+T.recaudo+'</dt><dd>'+copM(r.bruto)+'</dd><dt>'+T.iva+'</dt><dd>− '+copM(r.iva)+'</dd><dt class="tt">'+T.ingNeto+'</dt><dd class="tt">'+copM(r.ing)+'</dd>';
  Object.keys(r.c).forEach(function(k){ h+='<dt>'+T.etc[k]+'</dt><dd>'+copM(r.c[k])+'</dd>'; });
  return h+'<dt class="tt">'+T.costosTot+'</dt><dd class="tt">'+copM(r.tot)+'</dd>'; }
function escenarios(){
  var cont=$('#escCards'); if(!cont||!D.escenarios||!D.modelo) return;
  cont.innerHTML = D.escenarios.map(function(e){ var r=calc(e);
    return '<div><span class="num">'+esc(e.sub)+'</span><h4>'+esc(e.nombre)+'</h4><div class="gr '+(r.util<0?'neg':'')+'">'+(r.util<0?'− ':'')+copM(Math.abs(r.util))+'</div>'+
      '<div class="peq">'+(r.util<0?T.perdida:T.utilidad)+T.opEst+pct(num(r.margen,1))+' · ≈ '+(r.util<0?'− ':'')+usd(Math.abs(r.util)/D.trm)+'</div><dl>'+
      '<dt>'+T.ninosSede+'</dt><dd>'+num(e.ninos)+'</dd><dt>'+T.precioNino+'</dt><dd>'+cop(e.precio)+'</dd><dt>'+T.diasCoaches+'</dt><dd>'+e.dias+' · '+e.coachesIt+'</dd><dt>'+T.sedesGira+'</dt><dd>'+e.sedes+'</dd>'+
      filasCostos(r)+'<dt>'+T.pe+'</dt><dd>'+(r.pe?num(r.pe)+T.ninos:T.noAlcanza)+'</dd></dl><p class="peq" style="margin:10px 0 0">'+(e.nota||'')+'</p></div>'; }).join('');
  $$('[data-pe]').forEach(function(el){ var e=D.escenarios[+el.dataset.pe], r=calc(e); el.textContent = r.pe?num(r.pe):'—'; });
  var s=$('#sim'); if(!s) return;
  var base=D.escenarios[1]||D.escenarios[0];
  function ini(){ return {ninos:base.ninos,precio:base.precio,dias:base.dias,coachesIt:base.coachesIt,sedes:base.sedes,mkt:base.mkt,regalia:D.modelo.regaliaPct,iva:D.modelo.ivaPct}; }
  var p=ini();
  var defs=[['ninos',T.ninosSede,20,300,5,num],['precio',T.precioNino,300000,1800000,25000,cop],['dias',T.sDias,2,5,1,num],['coachesIt',T.sCoaches,1,6,1,num],['sedes',T.sSedes,1,3,1,num],['mkt',T.sMkt,2000000,40000000,1000000,cop],['regalia',T.sReg,0,25,1,pct]];
  s.innerHTML='<div class="ctr">'+defs.map(function(d){ return '<label><b><span>'+d[1]+'</span><span data-sv="'+d[0]+'"></span></b><input type="range" data-sk="'+d[0]+'" min="'+d[2]+'" max="'+d[3]+'" step="'+d[4]+'" value="'+p[d[0]]+'" aria-label="'+d[1]+'"></label>'; }).join('')+
    '<label style="display:flex;gap:8px;align-items:flex-start;color:var(--tinta)"><input type="checkbox" data-siva style="margin-top:3px"> <span>'+T.sIva+'</span></label>'+
    '<button data-sreset class="no-imp">'+T.sReset+'</button></div><div class="res caja" style="margin:0"></div>';
  function pinta(){ var r=calc(p);
    defs.forEach(function(d){ $('[data-sv="'+d[0]+'"]',s).textContent=d[5](p[d[0]]); });
    $('.res',s).innerHTML='<span class="num">'+T.sRes+'</span><div class="gr '+(r.util<0?'neg':'')+'">'+(r.util<0?'− ':'')+copM(Math.abs(r.util))+'</div>'+
      '<p class="peq" style="margin:2px 0 12px">'+(r.util<0?T.perdida:T.utilidad)+T.op+pct(num(r.margen,1))+' · ≈ '+(r.util<0?'− ':'')+usd(Math.abs(r.util)/D.trm)+' · '+T.peMin+'<b>'+(r.pe?num(r.pe)+T.ninos:T.noAlcanzaPrecio)+'</b></p><dl>'+filasCostos(r)+
      '<dt>'+T.sLocales+'</dt><dd>'+r.staffLocal+'</dd><dt>'+T.sMktNino+'</dt><dd>'+cop(p.mkt/p.ninos)+'</dd></dl>'; }
  $$('input[data-sk]',s).forEach(function(i){ i.addEventListener('input',function(){ p[i.dataset.sk]=+i.value; pinta(); }); });
  $('[data-siva]',s).addEventListener('change',function(e){ p.iva = e.target.checked?0:D.modelo.ivaPct; pinta(); });
  $('[data-sreset]',s).addEventListener('click',function(){ p=ini(); $$('input[data-sk]',s).forEach(function(i){i.value=p[i.dataset.sk]}); $('[data-siva]',s).checked=false; pinta(); });
  pinta();
  var ts=$('#sens'); if(ts && D.sens){
    var h='<table class="mz"><thead><tr><th>'+T.sensCab+'</th>'+D.sens.ninos.map(function(n){return '<th class="n">'+n+'</th>'}).join('')+'<th class="n">'+T.pe+'</th></tr></thead><tbody>';
    D.sens.precios.forEach(function(pr){ h+='<tr><td><b class="nm">'+cop(pr)+'</b></td>'; var pe=null;
      D.sens.ninos.forEach(function(n){ var q=ini(); q.ninos=n; q.precio=pr; var r=calc(q); pe=r.pe;
        h+='<td class="n" style="'+(r.util<0?'color:var(--cr);background:var(--cr-s)':'background:var(--ok-s);color:var(--ok)')+';font-weight:600">'+(r.util<0?'▼ − ':'▲ + ')+num(Math.abs(r.util)/1e6,1)+' M</td>'; });
      h+='<td class="n">'+(pe?pe+T.ninos:'—')+'</td></tr>'; });
    ts.innerHTML=h+'</tbody></table>'; }
}

/* ---------- fuentes ---------- */
function fuentes(){
  var c=$('#fuentesLista'); if(!c||!D.fuentes) return;
  var cats=[], porCat={};
  D.fuentes.forEach(function(f,i){ f.n=i+1; if(!porCat[f.cat]){ porCat[f.cat]=[]; cats.push(f.cat); } porCat[f.cat].push(f); });
  c.innerHTML = cats.map(function(cat){ return '<h3>'+esc(cat)+' <small style="font:500 13px var(--txt);color:var(--tinta2);text-transform:none;letter-spacing:0">· '+porCat[cat].length+'</small></h3><ul class="ftes-lista">'+
    porCat[cat].map(function(f){ return '<li id="f'+f.n+'"><b>['+f.n+']</b>'+(f.u.charAt(0)==='#'?esc(f.t):'<a href="'+esc(f.u)+'" target="_blank" rel="noopener">'+esc(f.t)+'</a>')+(f.d?' <span>— '+esc(f.d)+'</span>':'')+'</li>'; }).join('')+'</ul>'; }).join('');
  var n=$('#nFuentes'); if(n) n.textContent=D.fuentes.length;
}
/* referencias por clave: <sup data-f="clave1,clave2"></sup> → números */
function refs(){
  var idx={}; (D.fuentes||[]).forEach(function(f,i){ if(f.id) idx[f.id]=i+1; });
  $$('[data-f]').forEach(function(el){ var ks=el.dataset.f.split(',').map(function(k){return idx[k.trim()]}).filter(Boolean);
    el.className='r'; el.innerHTML=ks.map(function(i){return '<a href="#f'+i+'" title="'+T.verFuente+i+'">['+i+']</a>'}).join(''); });
}
function datos(){ $$('[data-d]').forEach(function(el){ var v=D, ks=el.dataset.d.split('.'); for(var i=0;i<ks.length&&v!=null;i++) v=v[ks[i]]; if(v!=null) el.textContent = el.dataset.fmt==='cop'?cop(v):el.dataset.fmt==='num'?num(v):v; }); }

/* ---------- arranque y cambio de idioma ---------- */
function arranca(lang, cambio){
  if(!window.DATA || !window.DATA[lang]) lang='es';
  var app=$('#app'), tpl=document.getElementById('tpl-'+lang); if(!app||!tpl) return;
  // al cambiar de idioma se conserva la sección que se estaba leyendo
  var seccion=null;
  if(cambio){ var act=$('#nav a.act'); seccion = act ? act.getAttribute('href').slice(1) : null; }
  L=lang; T=TXT[lang]; LOC=T.loc;
  document.documentElement.lang=lang; document.title=T.titulo;
  try{ localStorage.setItem('sc_col_idioma', lang); }catch(e){}
  app.innerHTML = tpl.innerHTML;
  D = window.DATA[lang]();
  var idx={}; (D.fuentes||[]).forEach(function(f,i){ if(f.id) idx[f.id]=i+1; });
  function conv(o){ if(!o||typeof o!=='object') return; if(Array.isArray(o)){ o.forEach(conv); return; }
    if(o.f!=null){ o.f=(Array.isArray(o.f)?o.f:[o.f]).map(function(k){return typeof k==='string'?idx[k]:k}).filter(Boolean); if(!o.f.length) delete o.f; }
    for(var k in o) if(k!=='f') conv(o[k]); }
  conv(D.kpis); conv(D.graficos);
  [nav,datos,kpis,barras,competidores,tablas,ciudades,escenarios,fuentes,refs].forEach(function(fn){ try{ fn(); }catch(e){ console.error(fn.name,e); } });
  var destino = seccion || (!cambio && location.hash ? location.hash.slice(1) : null);
  if(destino){ var el=document.getElementById(destino); if(el){ var prev=document.documentElement.style.scrollBehavior; document.documentElement.style.scrollBehavior='auto'; el.scrollIntoView(); document.documentElement.style.scrollBehavior=prev; } }
}
window.cambiarIdioma = function(l){ arranca(l, true); };
function idiomaInicial(){
  var m=/[?&]lang=(es|en)\b/.exec(location.search); if(m) return m[1];
  try{ var g=localStorage.getItem('sc_col_idioma'); if(g==='es'||g==='en') return g; }catch(e){}
  return 'es';
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){ arranca(idiomaInicial(), false); }); else arranca(idiomaInicial(), false);
})();
